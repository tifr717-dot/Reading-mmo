name: Apply Reading MMO v5.10.5 archive polish

on:
  push:
    paths:
      - '.github/workflows/apply-reading-mmo-v5105.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v5.10.5 archive shelf and record polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text()
          text=text.replace('<div class="health-row"><b>Version</b><span>v5.10.4</span></div>','<div class="health-row"><b>Version</b><span>v5.10.5</span></div>')
          css=r'''
          <style id="v5105-archive-shelf-record-polish">
          /* v5.10.5 — approved Archive chrome is locked; only shelf + open-book record change. */
          #library .v5104-shelf-row{min-height:326px!important;padding:24px 26px 34px!important;border-radius:13px!important;background:radial-gradient(ellipse at 50% 34%,rgba(106,63,34,.18),transparent 52%),linear-gradient(180deg,rgba(25,11,7,.18),rgba(9,4,3,.14)),url('./v53-wood-tile.png') center/170px auto repeat!important;box-shadow:0 8px 15px rgba(0,0,0,.25),inset 0 0 0 5px #351b12,inset 0 0 0 7px #8d5d31,inset 0 0 0 9px rgba(218,169,86,.18)!important}
          #library .v5104-shelf-row::before{left:18px!important;right:18px!important;top:16px!important;height:13px!important;background:linear-gradient(180deg,#aa773d,#62371c 58%,#2d160e)!important;border-color:#c18a48!important;border-radius:7px!important}
          #library .v5104-shelf-row::after{left:24px!important;right:24px!important;bottom:13px!important;height:18px!important;background:linear-gradient(180deg,#c58a47 0 13%,#7b4924 13% 47%,#452317 47% 80%,#20100a 80%)!important;border-color:#916033!important;border-top-color:#d9a15a!important}
          #library .v5104-shelf-decor.candle{left:19px!important;bottom:34px!important;transform:scale(2.45)!important;opacity:.98}
          #library .v5104-shelf-decor.books{right:18px!important;bottom:37px!important;transform:scale(1.38)!important;opacity:.98}
          #library .v5104-shelf-decor.ivy-l{left:8px!important;top:5px!important;transform:scale(1.95) rotate(-13deg)!important}
          #library .v5104-shelf-decor.ivy-r{right:8px!important;top:5px!important;transform:scale(1.95) rotate(13deg) scaleX(-1)!important}
          #library .v5104-books{left:7.2%!important;right:7.2%!important;top:31px!important;bottom:31px!important;gap:5px!important;align-items:flex-end!important;justify-content:center!important}
          #library .v5104-book{--c1:#6f4d8f;--c2:#34213f;flex:1 1 0!important;max-width:72px!important;min-width:0!important;height:93%!important;padding:16px 5px 22px!important;border:1px solid #160906!important;border-radius:12px 12px 4px 4px / 9px 9px 4px 4px!important;background:linear-gradient(90deg,rgba(255,246,214,.17),transparent 10%,transparent 86%,rgba(0,0,0,.30)),linear-gradient(180deg,rgba(255,255,255,.06),transparent 15%),linear-gradient(180deg,var(--c1),var(--c2))!important;outline:1px solid rgba(221,177,91,.70)!important;outline-offset:-4px!important;box-shadow:3px 5px 0 #120704,0 8px 10px rgba(0,0,0,.30),inset 0 0 10px rgba(0,0,0,.12)!important}
          #library .v5104-book.h1{height:93%!important}#library .v5104-book.h2{height:96%!important}#library .v5104-book.h3{height:94%!important}#library .v5104-book.h4{height:97%!important}#library .v5104-book.h5{height:95%!important}
          #library .v5104-book::before{inset:8px 7px 24px!important;border:1px solid rgba(247,208,118,.52)!important;border-radius:8px 8px 3px 3px!important;box-shadow:inset 0 0 0 1px rgba(45,19,10,.20)!important}
          #library .v5104-book::after{left:10px!important;right:10px!important;bottom:26px!important;height:34px!important;background:linear-gradient(180deg,transparent 0 8%,rgba(235,192,99,.52) 8% 11%,transparent 11% 78%,rgba(235,192,99,.48) 78% 81%,transparent 81%)!important;opacity:.8!important}
          #library .v5104-book-icon{position:absolute!important;left:50%!important;top:auto!important;bottom:34px!important;transform:translateX(-50%)!important;width:22px;height:22px;display:grid!important;place-items:center!important;color:#e8bd63!important;font:900 clamp(9px,1.7vw,13px)/1 Georgia,'Times New Roman',serif!important;text-shadow:0 1px 1px #1d0c07,0 0 4px rgba(255,212,119,.16)!important}
          #library .v5104-book-title{inset:24px 11px 66px!important;color:#f5dfaa!important;font:900 clamp(7.3px,1.42vw,11.2px)/1 Georgia,'Times New Roman',serif!important;letter-spacing:.08px!important}
          #library .v5104-book-series{left:7px!important;right:7px!important;bottom:7px!important;height:14px!important;border-top:1px solid rgba(243,204,113,.42)!important;border-bottom:1px solid rgba(10,4,2,.26)!important;background:linear-gradient(180deg,rgba(22,9,6,.16),rgba(12,5,3,.42))!important;font-size:clamp(4px,.84vw,6px)!important}
          #library .v5104-book-fav{right:9px!important;top:10px!important;color:#ffe08b!important;font-size:7px!important}
          #library .v5105-spine-crown{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:3;color:#e9c36e;font:900 7px/1 Georgia,serif;text-shadow:0 1px 1px #1b0b06}
          #library .v5105-spine-bookmark{display:none;position:absolute;right:9px;top:-1px;width:8px;height:30px;z-index:5;background:linear-gradient(180deg,#9e4c34,#6e2b24);border-left:1px solid #d7a25c;border-right:1px solid #d7a25c;clip-path:polygon(0 0,100% 0,100% 76%,50% 100%,0 76%);box-shadow:0 2px 4px rgba(0,0,0,.35)}
          #library .v5104-book.selected{transform:translateY(-6px)!important;box-shadow:0 0 0 1px #f0cf81,0 0 18px rgba(255,196,72,.38),3px 9px 0 #120704,0 12px 16px rgba(0,0,0,.34)!important}
          #library .v5104-book.selected .v5105-spine-bookmark{display:block}
          #library .v5104-detail-view{margin-top:8px!important}
          #library .v5104-detail-book{aspect-ratio:845/434!important;min-height:0!important;overflow:visible!important}
          #library .v5104-detail-left{left:6.8%!important;top:12.2%!important;width:35.2%!important;bottom:11.4%!important;gap:5px!important;align-items:center!important;justify-content:flex-start!important}
          #library .v5104-cover-frame{width:58%!important;max-height:70%!important;aspect-ratio:2/3!important;border-radius:3px!important;border:2px solid #29130c!important;outline:1px solid #aa7b42!important;outline-offset:-5px!important;box-shadow:3px 5px 0 rgba(43,20,11,.56),0 7px 10px rgba(0,0,0,.18)!important}
          #library .v5104-cover-frame img{color:transparent!important;font-size:0!important}
          #library .v5104-cover-placeholder{padding:7px!important}#library .v5104-cover-placeholder span{font-size:18px!important}#library .v5104-cover-placeholder b{font-size:5.8px!important;line-height:1.12!important}
          #library .v5104-cover-actions{width:70%!important;gap:3px!important}#library .v5104-cover-actions button{min-height:23px!important;font-size:3.8px!important;border-radius:6px!important}
          #library .v5104-detail-right{left:49.2%!important;right:8.5%!important;top:15.3%!important;bottom:12.2%!important;display:flex!important;flex-direction:column!important;min-width:0!important;color:#52351f!important}
          #library .v5104-entry{align-self:flex-start!important;padding:3px 7px!important;border-radius:999px!important;font-size:3.6px!important;letter-spacing:.25px!important}
          #library .v5104-title{margin:6px 0 2px!important;max-width:100%!important;color:#4b2d1b!important;font:900 clamp(10px,2.55vw,17px)/1.02 Georgia,'Times New Roman',serif!important;white-space:normal!important;overflow-wrap:anywhere!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
          #library .v5104-author{margin-top:1px!important;color:#78563c!important;font:800 clamp(4.5px,1vw,6px)/1.15 ui-monospace,monospace!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
          #library .v5104-rating-row{margin-top:6px!important;min-height:21px!important;display:flex!important;align-items:center!important;gap:4px!important}#library .v5104-rating{padding:4px 7px!important;border-radius:7px!important;font-size:5.5px!important}#library .v5104-favorite{margin-left:0!important;font-size:3.8px!important;white-space:nowrap!important}
          #library .v5104-ledger{display:grid!important;grid-template-columns:1fr 1fr!important;gap:5px!important;margin-top:7px!important}#library .v5104-ledger>div{min-height:37px!important;padding:5px 6px!important;border-radius:2px!important;background:rgba(255,247,222,.34)!important;border:1px solid rgba(159,114,63,.48)!important}#library .v5104-ledger span{margin-bottom:3px!important;font-size:3.25px!important;letter-spacing:.15px!important}#library .v5104-ledger b{font-size:4.8px!important;line-height:1.08!important}
          #library .v5104-notes{margin-top:5px!important;max-height:35px!important;overflow:hidden!important;padding:4px 2px!important;border-top:1px solid rgba(148,105,58,.34)!important;font-size:3.9px!important;line-height:1.25!important}#library .v5104-notes b{font-size:3.1px!important}
          #library .v5104-detail-actions{left:0!important;right:0!important;bottom:0!important;gap:5px!important}#library .v5104-detail-actions button{min-height:24px!important;padding:3px 4px!important;border-radius:7px!important;font-size:3.8px!important}
          #library .v5104-detail-close{position:absolute;right:7.2%;top:8.6%;z-index:4;min-height:0!important;padding:4px 7px!important;border-radius:999px!important;background:#4b2a1c!important;color:#ead09b!important;border:1px solid #946738!important;box-shadow:0 2px 0 rgba(34,14,8,.28)!important;font-size:3.5px!important}
          @media(max-width:420px){#library .v5104-shelf-row{min-height:285px!important;padding-left:20px!important;padding-right:20px!important}#library .v5104-books{left:6.4%!important;right:6.4%!important;gap:3px!important}#library .v5104-book{max-width:56px!important;border-radius:9px 9px 3px 3px / 7px 7px 3px 3px!important}#library .v5104-book-title{inset:23px 8px 61px!important;font-size:6.5px!important}#library .v5104-book-icon{bottom:31px!important;font-size:8px!important}#library .v5104-book-series{left:5px!important;right:5px!important;height:13px!important;font-size:3.6px!important}#library .v5104-detail-left{left:6.5%!important;top:13%!important;width:35.5%!important;bottom:12%!important}#library .v5104-cover-frame{width:60%!important}#library .v5104-detail-right{left:49.5%!important;right:7.8%!important;top:15.7%!important;bottom:12.5%!important}#library .v5104-title{font-size:10.5px!important;line-height:1!important;margin-top:5px!important}#library .v5104-ledger>div{min-height:33px!important;padding:4px 5px!important}#library .v5104-ledger b{font-size:4.2px!important}#library .v5104-detail-actions button{font-size:3.4px!important;min-height:22px!important}}
          </style>
          '''
          if 'v5105-archive-shelf-record-polish' not in text:
              text=text.replace('</head>',css+'\n</head>')
          needle='<div class="v5104-detail-book">\n        <img class="v5104-detail-bg" src="./v53-open-book.png" alt="Open archive record book">'
          repl='<div class="v5104-detail-book">\n        <img class="v5104-detail-bg" src="./v53-open-book.png" alt="Open archive record book">\n        <button class="v5104-detail-close" onclick="closeLibraryDetail()">CLOSE RECORD</button>'
          if '<button class="v5104-detail-close"' not in text and needle in text:
              text=text.replace(needle,repl,1)
          text=text.replace('<img id="libraryDetailCoverImg" alt="Book cover" hidden>','<img id="libraryDetailCoverImg" alt="" hidden>')
          start=text.index('function libraryBookCardMarkup(b,volumeNo){')
          end=text.index('function libraryShelfRowsMarkup',start)
          new_func='''function libraryBookCardMarkup(b,volumeNo){
           const n=Number(volumeNo||1), h=(n-1)%5+1;
           const selected=String(libraryDetailId||'')===String(b.id)?' selected':'';
           const series=librarySeriesShort(b.series);
           const motif=series==='#6'?'⚜':series==='#5'?'☁':series==='#4'?'†':series==='#3'?'❧':series==='#2'?'♡':series==='#1'?'♦':series==='STANDALONE'?'◈':'✦';
           return `<button class="v5104-book c${Number(b.color)%8} h${h}${selected}" onclick="openLibraryRecord('${esc(b.id)}')" aria-label="Open library record for ${esc(b.title)} by ${esc(b.author||'Unknown author')}">
             ${b.favorite?'<span class="v5104-book-fav">★</span>':''}
             <span class="v5105-spine-crown">✦</span>
             <span class="v5105-spine-bookmark" aria-hidden="true"></span>
             <span class="v5104-book-icon">${motif}</span>
             <span class="v5104-book-title">${esc(b.title)}</span>
             <span class="v5104-book-series">${esc(series)}</span>
            </button>`;
          }
          '''
          text=text[:start]+new_func+text[end:]
          old="if(img)img.onerror=()=>{img.removeAttribute('src');img.hidden=true;if(placeholder)placeholder.hidden=false;};"
          new="if(img)img.onerror=()=>{img.removeAttribute('src');img.hidden=true;if(placeholder)placeholder.hidden=false;if(remove)remove.hidden=true;};"
          text=text.replace(old,new,1)
          p.write_text(text)
          sw=Path('service-worker.js')
          sw.write_text(sw.read_text().replace('reading-mmo-v5.10.4-archive-reference-spine-library','reading-mmo-v5.10.5-archive-shelf-record-polish'))
          Path('BUILD-NOTES-v5.10.5.txt').write_text('''Reading MMO v5.10.5 — Archive Shelf + Record Polish\n\nLOCKED / unchanged:\n- Approved Enchanted Archive header, stats, search, Add Volume, and filter artwork.\n\nShelf:\n- Richer leather-like fantasy spines closer to the approved concept.\n- Gold inner borders, crown marks, individual series motifs, subtler height variation, selected-book bookmark/glow.\n- Seven-book shelf behavior retained.\n\nOpen-book record:\n- Repositioned cover, title, author, rating, favorite state, metadata, notes, and actions to fit the left/right pages.\n- Long titles wrap to two lines.\n- Added Close Record.\n- Broken/stale cover images fall back cleanly.\n\nApp Health and service-worker cache bumped to v5.10.5.\n''')
          PY
      - name: Commit app update
        shell: bash
        run: |
          git config user.name "Reading MMO updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js BUILD-NOTES-v5.10.5.txt
          git commit -m "Reading MMO v5.10.5 archive shelf and record polish"
          git push
