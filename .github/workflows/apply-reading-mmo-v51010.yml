name: Apply Reading MMO v5.10.10 archive concept rebuild

on:
  push:
    paths:
      - '.github/workflows/apply-reading-mmo-v51010.yml'
      - '.github/scripts/apply_v51010.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v5.10.10 archive rebuild
        run: python .github/scripts/apply_v51010.py

      - name: Validate changed files
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('index.html','utf8'); const parts=[...s.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]); fs.writeFileSync('/tmp/reading-mmo-inline.js',parts.join('\\n'));"
          node --check /tmp/reading-mmo-inline.js
          node --check service-worker.js
          grep -q 'v51010-concept-faithful-archive' index.html
          grep -q 'v5.10.10' index.html
          test -f archive-spine-6.svg
          test -f archive-spine-standalone.svg

      - name: Commit app update
        run: |
          git config user.name "Reading MMO updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js BUILD-NOTES-v5.10.10.txt archive-spine-*.svg
          git commit -m "Reading MMO v5.10.10 concept-faithful archive rebuild"
          git push
