name: Deploy v5.10.45 Staging

on:
  push:
    branches: [v51045-simplified-redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-v51045-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy staging branch to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# redeploy after staging branch authorization
