name: Apply Reading MMO v5.10.25 Expanding Archive Shelves

on:
  push:
    paths:
      - '.github/workflows/apply-reading-mmo-v51025-expanding-archive.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create v5.10.25 expanding archive runtime
        shell: bash
        run: |
          cat > archive-v51025.js <<'EOF'
          /* Reading MMO v5.10.25 — expanding Archive shelves.
             Shelf 1 remains the exact approved concept artwork.
             Books 8+ grow into matching live shelves in groups of seven. */
          (function(){
            const BUILD='v5.10.25';
            window.__readingMmoVersionOwner=BUILD;

            const priorShelfRows=window.libraryShelfRowsMarkup;
            const norm=v=>String(v||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');
            const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
            const jsq=s=>String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
            const canonical=new Set([
              "archangel's legion","archangel's storm","archangel's blade",
              "archangel's consort","archangel's kiss","angels' blood",
              'a stage set for villains'
            ]);
            const heights=[94,99,92,97,95,98,93];
            const tilts=[-.45,.2,-.15,.28,-.22,.12,-.32];

            function ensureCss(){
              let l=document.getElementById('archive-v51025-css');
              if(!l){l=document.createElement('link');l.id='archive-v51025-css';l.rel='stylesheet';document.head.appendChild(l);}
              l.href='./archive-v51025.css?v=51025';
            }
            function stamp(){
              window.__readingMmoVersionOwner=BUILD;
              const badge=document.getElementById('headerVersionText');
              if(badge)badge.textContent=BUILD;
              document.querySelectorAll('.health-row').forEach(row=>{
                if(row.querySelector('b')?.textContent.trim()==='Version'){
                  const value=row.querySelector('span');if(value)value.textContent=BUILD;
                }
              });
            }
            function seriesShort(b){
              if(typeof window.librarySeriesShort==='function')return window.librarySeriesShort(b.series);
              const raw=String(b.series||'').trim();
              const m=raw.match(/#\s*(\d+)\s*$/);
              return m?`#${m[1]}`:'STANDALONE';
            }
            function entryNo(b,volumeNo,fallback){
              const n=Number(volumeNo?.get?.(String(b.id))||0);
              return n>0?n:fallback;
            }
            function paletteIndex(b,n){
              const c=Number(b.color);
              return Number.isFinite(c)?Math.abs(Math.floor(c))%8:Math.abs(n)%8;
            }
            function artKey(b,n){
              const short=seriesShort(b);
              if(String(short).toUpperCase()==='STANDALONE')return 'standalone';
              const m=String(short).match(/^#(\d+)$/);
              if(m){const v=Number(m[1]);if(v>=1&&v<=6)return String(v);}
              return String(((Math.max(1,n)-1)%6)+1);
            }
            function spineMarkup(b,n,pos){
              const id=jsq(b.id),short=seriesShort(b),palette=paletteIndex(b,n),art=artKey(b,n);
              const selected=String(window.__archiveSelectedId||'')===String(b.id)?' selected':'';
              const titleSize=String(b.title||'').length>31?7:String(b.title||'').length>23?8:9;
              return `<button class="v51025-live-spine p${palette}${selected}" style="grid-column:${7-pos};--book-h:${heights[pos]}%;--book-tilt:${tilts[pos]}deg;--title-size:${titleSize}px" onclick="window.__archiveSelectedId='${id}';openLibraryRecord('${id}')" aria-label="Open library record for ${esc(b.title)} by ${esc(b.author||'Unknown author')}"><img class="v51025-spine-ornament" src="./archive-spine-${art}.svg" alt="" aria-hidden="true"><span class="v51025-spine-title">${esc(b.title)}</span><span class="v51025-spine-series">${esc(short)}</span>${b.favorite?'<span class="v51025-spine-fav">★</span>':''}<span class="v51025-spine-shadow" aria-hidden="true"></span></button>`;
            }
            function shelfMarkup(group,shelfIndex){
              const books=group.slice().sort((a,b)=>a.n-b.n);
              const live=books.map(x=>spineMarkup(x.b,x.n,x.pos)).join('');
              return `<div class="v51025-expanding-shelf" data-archive-shelf="${shelfIndex+2}" aria-label="Archive shelf ${shelfIndex+2}"><img class="v51025-expand-bg" alt="" aria-hidden="true"><span class="v51025-blank-panel" aria-hidden="true"></span><span class="v51025-top-shadow" aria-hidden="true"></span><span class="v51025-shelf-plank" aria-hidden="true"></span><div class="v51025-live-books">${live}</div></div>`;
            }
            function hydrateBackgrounds(){
              const source=[...document.querySelectorAll('.v51023-concept-bg')].find(img=>img.getAttribute('src'));
              const src=source?.getAttribute('src');
              if(!src)return false;
              document.querySelectorAll('.v51025-expand-bg').forEach(img=>{if(img.getAttribute('src')!==src)img.setAttribute('src',src);});
              return true;
            }

            window.libraryShelfRowsMarkup=function(rows,volumeNo){
              const list=Array.isArray(rows)?rows:[];
              const first=list.filter(b=>canonical.has(norm(b.title)));
              let html=typeof priorShelfRows==='function'?priorShelfRows(first,volumeNo):'';
              const extras=list.filter(b=>!canonical.has(norm(b.title)));
              const groups=new Map();
              extras.forEach((b,i)=>{
                let n=entryNo(b,volumeNo,8+i);
                if(n<8)n=8+i;
                const offset=n-8;
                const shelfIndex=Math.floor(offset/7);
                const pos=((offset%7)+7)%7;
                if(!groups.has(shelfIndex))groups.set(shelfIndex,[]);
                groups.get(shelfIndex).push({b,n,pos});
              });
              [...groups.keys()].sort((a,b)=>a-b).forEach(k=>{html+=shelfMarkup(groups.get(k),k);});
              setTimeout(hydrateBackgrounds,0);
              return html;
            };

            function apply(){
              ensureCss();stamp();
              const obs=new MutationObserver(()=>hydrateBackgrounds());
              obs.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['src']});
              if(typeof window.renderLibrary==='function')window.renderLibrary();
              [50,160,400,900,1600,3000].forEach(ms=>setTimeout(()=>{hydrateBackgrounds();stamp();},ms));
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();
          })();
          EOF

          cat > archive-v51025.css <<'EOF'
          /* Reading MMO v5.10.25 — matching live Archive shelves for books 8+. */
          #library .v51025-expanding-shelf{
            position:relative!important;width:100%!important;aspect-ratio:975/625!important;
            margin:11px 0 18px!important;overflow:hidden!important;background:#160b07!important;
            box-shadow:0 12px 28px rgba(0,0,0,.38)!important;isolation:isolate!important;
          }
          #library .v51025-expand-bg{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:fill!important;z-index:1!important;image-rendering:pixelated!important;}
          #library .v51025-blank-panel{
            position:absolute!important;left:9.5%!important;right:9.7%!important;top:15.2%!important;bottom:10.5%!important;z-index:2!important;
            background:
              linear-gradient(90deg,rgba(11,5,3,.76),transparent 7%,transparent 93%,rgba(9,4,2,.78)),
              linear-gradient(180deg,rgba(7,3,2,.48),transparent 15%,transparent 78%,rgba(5,2,1,.58)),
              repeating-linear-gradient(0deg,#28140d 0 8px,#301910 8px 16px,#26130c 16px 23px)!important;
            border:3px solid #5b321d!important;box-shadow:inset 0 0 0 2px #1a0b07,inset 0 18px 22px rgba(0,0,0,.48),inset 0 -12px 18px rgba(0,0,0,.48)!important;
          }
          #library .v51025-top-shadow{position:absolute!important;left:10.2%!important;right:10.4%!important;top:17.2%!important;height:4.2%!important;z-index:3!important;background:linear-gradient(#120704,transparent)!important;opacity:.92!important;}
          #library .v51025-shelf-plank{
            position:absolute!important;left:8.8%!important;right:8.8%!important;bottom:9.6%!important;height:5.5%!important;z-index:5!important;
            background:linear-gradient(#9b5f2c 0 12%,#5a2e17 13% 42%,#3d1d10 43% 74%,#1e0d07 75% 100%)!important;
            border-top:2px solid #d08a3e!important;border-bottom:3px solid #120603!important;box-shadow:0 5px 0 rgba(0,0,0,.42)!important;
          }
          #library .v51025-live-books{
            position:absolute!important;left:11.4%!important;right:11.5%!important;top:20.2%!important;bottom:13.7%!important;z-index:6!important;
            display:grid!important;grid-template-columns:repeat(7,1fr)!important;gap:.5%!important;align-items:end!important;pointer-events:none!important;
          }
          #library .v51025-live-spine{
            pointer-events:auto!important;position:relative!important;align-self:end!important;justify-self:center!important;width:94%!important;height:var(--book-h)!important;
            margin:0!important;padding:0!important;overflow:hidden!important;border:2px solid #2a1209!important;border-radius:2px 2px 1px 1px!important;
            transform:rotate(var(--book-tilt))!important;transform-origin:50% 100%!important;
            box-shadow:inset 3px 0 rgba(255,220,136,.12),inset -3px 0 rgba(0,0,0,.34),inset 0 -4px rgba(0,0,0,.3),4px 5px 0 rgba(8,3,2,.5)!important;
            transition:transform .14s ease,filter .14s ease!important;
          }
          #library .v51025-live-spine:active{transform:translateY(-3px) rotate(var(--book-tilt))!important;}
          #library .v51025-live-spine.selected{transform:translateY(-7px) rotate(var(--book-tilt))!important;filter:brightness(1.13) drop-shadow(0 0 5px rgba(238,194,90,.72))!important;}
          #library .v51025-live-spine.p0{background:linear-gradient(90deg,#321543,#6c347f 48%,#2b123a)!important}
          #library .v51025-live-spine.p1{background:linear-gradient(90deg,#3b1715,#8c3b30 48%,#35120f)!important}
          #library .v51025-live-spine.p2{background:linear-gradient(90deg,#173327,#3d7658 48%,#12291f)!important}
          #library .v51025-live-spine.p3{background:linear-gradient(90deg,#4d3210,#a17324 48%,#3c260b)!important}
          #library .v51025-live-spine.p4{background:linear-gradient(90deg,#173346,#39769a 48%,#11293a)!important}
          #library .v51025-live-spine.p5{background:linear-gradient(90deg,#3c2028,#79404d 48%,#311921)!important}
          #library .v51025-live-spine.p6{background:linear-gradient(90deg,#302e29,#6a665a 48%,#282620)!important}
          #library .v51025-live-spine.p7{background:linear-gradient(90deg,#402417,#8b5430 48%,#321b10)!important}
          #library .v51025-spine-ornament{position:absolute!important;inset:1.2% 3.5%!important;width:93%!important;height:97.5%!important;object-fit:fill!important;opacity:.94!important;filter:drop-shadow(0 1px 0 #261006)!important;pointer-events:none!important;}
          #library .v51025-spine-title{
            position:absolute!important;left:50%!important;top:26%!important;bottom:18%!important;transform:translateX(-50%) rotate(180deg)!important;
            writing-mode:vertical-rl!important;text-orientation:mixed!important;color:#f0dfb0!important;font-family:Georgia,'Times New Roman',serif!important;
            font-weight:700!important;font-size:var(--title-size)!important;letter-spacing:.2px!important;line-height:1!important;text-shadow:0 1px #241007,0 0 2px #1a0905!important;
            overflow:hidden!important;white-space:nowrap!important;z-index:4!important;pointer-events:none!important;
          }
          #library .v51025-spine-series{
            position:absolute!important;left:9%!important;right:9%!important;bottom:3.1%!important;z-index:4!important;
            min-height:8.5%!important;display:flex!important;align-items:center!important;justify-content:center!important;color:#f1d78e!important;
            font-family:Georgia,'Times New Roman',serif!important;font-size:clamp(5px,1.45vw,8px)!important;font-weight:700!important;white-space:nowrap!important;text-shadow:0 1px #1d0a05!important;pointer-events:none!important;
          }
          #library .v51025-spine-fav{position:absolute!important;right:9%!important;top:4.5%!important;z-index:5!important;color:#ffe6a0!important;font-size:clamp(8px,2vw,12px)!important;text-shadow:0 0 3px #5a2d10!important;pointer-events:none!important;}
          #library .v51025-spine-shadow{position:absolute!important;inset:0!important;z-index:1!important;pointer-events:none!important;background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 16%,transparent 78%,rgba(0,0,0,.23)),linear-gradient(180deg,rgba(255,224,145,.06),transparent 18%,transparent 80%,rgba(0,0,0,.18))!important;}
          @media(max-width:390px){
            #library .v51025-live-books{left:11%!important;right:11.1%!important;gap:.25%!important}
            #library .v51025-live-spine{width:96%!important;border-width:1px!important;box-shadow:inset 2px 0 rgba(255,220,136,.1),inset -2px 0 rgba(0,0,0,.35),3px 4px 0 rgba(8,3,2,.48)!important}
            #library .v51025-spine-series{font-size:5px!important}
          }
          EOF

          cat > BUILD-NOTES-v5.10.25.txt <<'EOF'
          Reading MMO v5.10.25 — Expanding Archive Shelves

          - Locks the approved first seven-book concept shelf exactly as it is.
          - Removes the old plain fallback for newly added Archive books.
          - Books 8–14 automatically render on Shelf 2, books 15–21 on Shelf 3, and so on in fixed groups of seven.
          - New shelves reuse the approved concept shelf artwork as their frame/decor, blank only the center book bay, and layer live ornate book spines on top.
          - New spines keep live title, series/standalone label, favorite state, shelf-mark color, selection state, and tap-to-open behavior.
          - Shelf groups fill from right to left so a completed shelf reads newest-to-oldest like the approved first shelf.
          - Archive top controls, first shelf artwork, open-book detail, and Shelved Volumes are untouched.
          EOF

      - name: Wire v5.10.25 into the app
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=re.sub(r"window\.__readingMmoVersionOwner='v5\.10\.\d+';","window.__readingMmoVersionOwner='v5.10.25';",text,count=1)
          for filename in ['archive-v51011.js','archive-v51013.js','archive-v51014.js','archive-v51016.js','archive-v51018.js','reading-shelf-v51021.js','archive-v51022.js']:
              text=re.sub(rf'(src="\./{re.escape(filename)}\?v=)\d+("[^>]*>)',rf'\g<1>51025\g<2>',text,count=1)
          marker='<script src="./archive-v51022.js?v=51025"></script>'
          if marker not in text:
              raise SystemExit('archive-v51022 script marker missing')
          if './archive-v51025.js?v=51025' not in text:
              text=text.replace(marker,marker+'\n<script src="./archive-v51025.js?v=51025"></script>',1)
          text,n=re.subn(r'navigator\.serviceWorker\.register\("\./service-worker(?:-v\d+)?\.js\?v=\d+",\{updateViaCache:"none"\}\)',
                         'navigator.serviceWorker.register("./service-worker-v51025.js?v=51025",{updateViaCache:"none"})',text,count=1)
          if n!=1:
              raise SystemExit('service worker registration not updated')
          p.write_text(text,encoding='utf-8')

          base=Path('service-worker-v51024.js').read_text(encoding='utf-8')
          base=re.sub(r"const CACHE = '[^']+';","const CACHE = 'reading-mmo-v5.10.25-expanding-archive-shelves';",base,count=1)
          base=re.sub(r"const FORCE_VERSION = '\d+';","const FORCE_VERSION = '51025';",base,count=1)
          core_marker="  './archive-v51022.js',\n"
          addition="  './archive-v51022.js',\n  './archive-v51025.css',\n  './archive-v51025.js',\n"
          if "'./archive-v51025.js'" not in base:
              if core_marker not in base:
                  raise SystemExit('service worker CORE marker missing')
              base=base.replace(core_marker,addition,1)
          Path('service-worker-v51025.js').write_text(base,encoding='utf-8')
          Path('service-worker.js').write_text(base,encoding='utf-8')

      - name: Verify v5.10.25
        shell: python
        run: |
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          js=Path('archive-v51025.js').read_text(encoding='utf-8')
          css=Path('archive-v51025.css').read_text(encoding='utf-8')
          sw=Path('service-worker-v51025.js').read_text(encoding='utf-8')
          assert "window.__readingMmoVersionOwner='v5.10.25';" in html
          assert './archive-v51025.js?v=51025' in html
          assert './service-worker-v51025.js?v=51025' in html
          assert "const BUILD='v5.10.25';" in js
          assert 'priorShelfRows(first,volumeNo)' in js
          assert 'Math.floor(offset/7)' in js
          assert 'grid-column:${7-pos}' in js
          assert '.v51025-expanding-shelf' in css
          assert "FORCE_VERSION = '51025'" in sw
          assert "'./archive-v51025.js'" in sw
          assert "'./archive-v51025.css'" in sw
          print('v5.10.25 expanding Archive verification passed.')

      - name: Commit v5.10.25
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive-v51025.js archive-v51025.css BUILD-NOTES-v5.10.25.txt index.html service-worker.js service-worker-v51025.js
          git commit -m "Reading MMO v5.10.25 expanding archive shelves"
          git push
