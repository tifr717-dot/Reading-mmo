name: Build CrossInk X4 BLE Book-Aware Sync Firmware

on:
  push:
    branches:
      - crossink-x4-ble-sync-feasibility
    paths:
      - ".github/workflows/build-crossink-x4-ble-phase3.yml"
      - "firmware/crossink-x4-pages/**"
      - "firmware/crossink-x4-ble/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CROSSINK_COMMIT: 0de623ed24acd94ae2301e8e1f4a42e32613110b
  FREEINK_COMMIT: 1ff020263cd2202ea79ce3eb811f5ac8489b8cde
  CUSTOM_VERSION: 1.5.0-pages2-blesync3
  PAGES1_PATCH_B64_PATH: firmware/crossink-x4-pages/CrossInk-v1.5.0-pages-x4.patch.gz.b64
  PAGES2_EDIT_SCRIPT: firmware/crossink-x4-pages/apply-pages2-direct.py
  PAGES3_STATUSBAR_SCRIPT: firmware/crossink-x4-pages/apply-pages3-statusbar.py
  BLE_EDIT_SCRIPT: firmware/crossink-x4-ble/apply-ble-feasibility.py
  BLE_PHASE2_SCRIPT: firmware/crossink-x4-ble/apply-ble-phase2.py
  BLE_PHASE3_SCRIPT: firmware/crossink-x4-ble/apply-ble-phase3-book-title.py

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v6

      - name: Fetch exact CrossInk 1.5.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/uxjulia/CrossInk.git crossink
          cd crossink
          git checkout --detach "$CROSSINK_COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$CROSSINK_COMMIT"
          test "$(git -C freeink-sdk rev-parse HEAD)" = "$FREEINK_COMMIT"

      - name: Record protected hardware inputs
        shell: bash
        run: |
          set -euo pipefail
          cd crossink
          sha256sum partitions.csv > "$GITHUB_WORKSPACE/protected-before.sha256"
          git -C freeink-sdk rev-parse HEAD > "$GITHUB_WORKSPACE/freeink-before.txt"
          git diff --exit-code

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-crossink-ble-platformio-${{ env.CROSSINK_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-crossink-ble-platformio-

      - name: Install exact PlatformIO Core
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          pio --version

      - name: Build pristine 1.5.0 baseline
        shell: bash
        env:
          CROSSINK_RELEASE_VERSION: 1.5.0
        run: |
          set -euo pipefail
          cd crossink
          pio run -j1 -e default 2>&1 | tee "$GITHUB_WORKSPACE/baseline-build.log"
          mkdir -p "$GITHUB_WORKSPACE/out"
          baseline=.pio/build/default/firmware-x3-x4-v1.5.0.bin
          test -s "$baseline"
          stat -c '%s' "$baseline" > "$GITHUB_WORKSPACE/baseline-size.txt"
          pio run -e default -t clean

      - name: Recreate known-good Pages source base
        shell: bash
        run: |
          set -euo pipefail
          encoded="$GITHUB_WORKSPACE/$PAGES1_PATCH_B64_PATH"
          compressed="$GITHUB_WORKSPACE/pages1-source.patch.gz"
          patch_file="$GITHUB_WORKSPACE/pages1-source.patch"
          base64 -d "$encoded" > "$compressed"
          gzip -t "$compressed"
          gzip -dc "$compressed" > "$patch_file"
          cd crossink
          git apply --check "$patch_file"
          git apply "$patch_file"
          python "$GITHUB_WORKSPACE/$PAGES2_EDIT_SCRIPT" "$GITHUB_WORKSPACE/crossink"
          python "$GITHUB_WORKSPACE/$PAGES3_STATUSBAR_SCRIPT" "$GITHUB_WORKSPACE/crossink"

      - name: Apply Reading MMO BLE Phase 3 edits
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/$BLE_EDIT_SCRIPT" "$GITHUB_WORKSPACE/crossink"
          python "$GITHUB_WORKSPACE/$BLE_PHASE2_SCRIPT" "$GITHUB_WORKSPACE/crossink"
          python "$GITHUB_WORKSPACE/$BLE_PHASE3_SCRIPT" "$GITHUB_WORKSPACE/crossink"
          cd crossink
          git diff --check
          grep -q 'BLEDevice::startAdvertising()' src/activities/network/ReadingMmoBleSyncActivity.cpp
          grep -q 'READING_MMO_PENDING_SESSION_PATH' src/activities/network/ReadingMmoBleSyncActivity.cpp
          grep -q '"p\\\":3' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'epub ? epub->getTitle()' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'appendReadingMmoJsonString' src/activities/reader/EpubReaderActivity.cpp
          grep -q 'char payload\[500\]' src/activities/network/ReadingMmoBleSyncActivity.cpp
          grep -q 'int count = 5;' src/activities/home/HomeActivity.cpp
          grep -q 'NetworkBootTarget::READING_MMO_SYNC' src/main.cpp
          grep -q 'Reading MMO Sync' src/activities/home/HomeActivity.cpp
          if grep -q 'BLEDevice::' src/main.cpp; then
            echo 'BLE must not initialize or advertise from normal main.cpp'
            exit 1
          fi
          if grep -A2 '^lib_ignore =' platformio.ini | grep -q '^  BLE$'; then
            echo 'BLE is still ignored in platformio.ini'
            exit 1
          fi
          sha256sum -c "$GITHUB_WORKSPACE/protected-before.sha256"
          test "$(git -C freeink-sdk rev-parse HEAD)" = "$(cat "$GITHUB_WORKSPACE/freeink-before.txt")"
          git diff --exit-code -- partitions.csv freeink-sdk
          git diff --name-only | tee "$GITHUB_WORKSPACE/changed-files.txt"
          git diff --stat | tee "$GITHUB_WORKSPACE/patch-stat.txt"

      - name: Install clang-format 21
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-21

      - name: Canonicalize formatting
        shell: bash
        run: |
          set -euo pipefail
          cd crossink
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --check
          sha256sum -c "$GITHUB_WORKSPACE/protected-before.sha256"
          git diff --exit-code -- partitions.csv freeink-sdk

      - name: Build book-aware BLE sync X3/X4 firmware
        shell: bash
        env:
          CROSSINK_RELEASE_VERSION: ${{ env.CUSTOM_VERSION }}
        run: |
          set -euo pipefail
          cd crossink
          pio run -j1 -e default 2>&1 | tee "$GITHUB_WORKSPACE/custom-build.log"
          custom=".pio/build/default/firmware-x3-x4-v${CUSTOM_VERSION}.bin"
          test -s "$custom"
          cp "$custom" "$GITHUB_WORKSPACE/out/firmware-x3-x4-v${CUSTOM_VERSION}.bin"

      - name: Validate Phase 3 firmware artifact
        shell: bash
        run: |
          set -euo pipefail
          custom="$GITHUB_WORKSPACE/out/firmware-x3-x4-v${CUSTOM_VERSION}.bin"
          baseline_size="$(cat "$GITHUB_WORKSPACE/baseline-size.txt")"
          custom_size="$(stat -c '%s' "$custom")"
          partition_limit=6553600
          required_headroom=50000
          headroom="$((partition_limit - custom_size))"
          delta="$((custom_size - baseline_size))"
          report="$GITHUB_WORKSPACE/out/BLE-PHASE3-SIZE-REPORT.txt"

          {
            echo "Reading MMO book-aware BLE sync firmware validation"
            echo "Baseline firmware bytes: $baseline_size"
            echo "Phase 3 firmware bytes: $custom_size"
            echo "Size delta bytes: $delta"
            echo "App partition limit bytes: $partition_limit"
            echo "Remaining headroom bytes: $headroom"
            echo "Required safe headroom bytes: $required_headroom"
          } > "$report"

          if (( custom_size >= partition_limit )); then
            echo "RESULT: FAIL - firmware exceeds app partition" >> "$report"
            exit 1
          fi
          if (( headroom < required_headroom )); then
            echo "RESULT: FAIL - firmware headroom below safety floor" >> "$report"
            exit 1
          fi
          echo "RESULT: PASS" >> "$report"

          custom_sha="$(sha256sum "$custom" | awk '{print $1}')"
          {
            echo "CrossInk Reading MMO BLE Sync Phase 3 — Book Aware"
            echo "Base CrossInk commit: $CROSSINK_COMMIT"
            echo "FreeInk SDK commit: $FREEINK_COMMIT"
            echo "Custom version: $CUSTOM_VERSION"
            echo "Custom SHA-256: $custom_sha"
            echo ""
            echo "Protocol: {\"p\":3,\"sid\":N,\"sp\":start,\"ep\":end,\"pg\":pages,\"sec\":seconds,\"title\":\"EPUB title\"}"
            echo "The EPUB metadata title comes directly from CrossInk epub->getTitle()."
            echo "UTF-8 titles are JSON escaped and truncated only on complete UTF-8 code-point boundaries if unusually long."
            echo "BLE remains isolated to Home → Reading MMO Sync."
            echo "The X4 Settings navigation-count fix remains included."
            echo "Existing Pages/Home/Sleep/Whole Book Page Count changes remain included."
          } > "$GITHUB_WORKSPACE/out/BUILD-INFO.txt"
          sha256sum "$custom" > "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"

      - name: Upload Phase 3 diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CrossInk-X4-BLE-Sync-Phase3-Book-Aware-Diagnostic
          path: |
            out/BLE-PHASE3-SIZE-REPORT.txt
            baseline-size.txt
            custom-build.log
            baseline-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Phase 3 flash package
        uses: actions/upload-artifact@v7
        with:
          name: CrossInk-X4-Reading-MMO-BLE-Sync-Phase3-Book-Aware
          path: |
            out/firmware-x3-x4-v${{ env.CUSTOM_VERSION }}.bin
            out/SHA256SUMS.txt
            out/BUILD-INFO.txt
            custom-build.log
            baseline-build.log
            patch-stat.txt
            changed-files.txt
          if-no-files-found: error
          retention-days: 30
