name: Apply Reading MMO v5.10.7 visual archive pass

on:
  push:
    paths:
      - '.github/workflows/apply-reading-mmo-v5107.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v5.10.7 archive visual pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text()

          text = text.replace('<span id="headerVersionText" class="app-version-badge">v5.10.6</span>', '<span id="headerVersionText" class="app-version-badge">v5.10.7</span>')
          text = text.replace('<div class="health-row"><b>Version</b><span>v5.10.6</span></div>', '<div class="health-row"><b>Version</b><span>v5.10.7</span></div>')

          css = r'''
          <style id="v5107-archive-visual-pass">
          /* v5.10.7 — approved archive top stays locked. Shelf + open-book record only. */
          #library .v5104-shelf-row{
            min-height:338px!important;padding:26px 28px 37px!important;border-radius:12px!important;
            background:radial-gradient(ellipse at 50% 31%,rgba(124,76,41,.18),transparent 49%),linear-gradient(180deg,rgba(23,10,6,.12),rgba(10,4,3,.15)),url('./v53-wood-tile.png') center/180px auto repeat!important;
            box-shadow:0 9px 18px rgba(0,0,0,.28),inset 0 0 0 4px #32190f,inset 0 0 0 7px #8f5c2d,inset 0 0 0 9px rgba(224,171,84,.16)!important
          }
          #library .v5104-shelf-row::before{left:17px!important;right:17px!important;top:14px!important;height:14px!important;border-radius:7px!important;background:linear-gradient(180deg,#b17a3c,#67401f 52%,#2d160e)!important;box-shadow:0 4px 0 rgba(15,7,4,.35),inset 0 1px rgba(255,221,149,.15)!important}
          #library .v5104-shelf-row::after{left:22px!important;right:22px!important;bottom:14px!important;height:20px!important;background:linear-gradient(180deg,#c58943 0 14%,#7a4822 14% 48%,#432117 48% 80%,#1b0d08 80%)!important;border-top-color:#e0a45b!important;box-shadow:0 6px 0 rgba(13,6,4,.47),inset 0 1px rgba(255,220,143,.12)!important}
          #library .v5104-shelf-decor.candle{left:20px!important;bottom:38px!important;transform:scale(2.7)!important}
          #library .v5104-shelf-decor.books{right:18px!important;bottom:39px!important;transform:scale(1.45)!important}
          #library .v5104-shelf-decor.ivy-l{left:8px!important;top:5px!important;transform:scale(2) rotate(-13deg)!important}
          #library .v5104-shelf-decor.ivy-r{right:8px!important;top:5px!important;transform:scale(2) rotate(13deg) scaleX(-1)!important}
          #library .v5104-books{left:8%!important;right:8%!important;top:35px!important;bottom:34px!important;gap:4px!important;align-items:flex-end!important}
          #library .v5104-book{
            flex:1 1 0!important;min-width:0!important;max-width:74px!important;height:91%!important;padding:16px 5px 24px!important;overflow:visible!important;
            border:1px solid #1c0b07!important;border-radius:10px 10px 3px 3px / 8px 8px 3px 3px!important;outline:1px solid rgba(228,183,91,.78)!important;outline-offset:-4px!important;
            background:linear-gradient(90deg,rgba(255,247,219,.18),transparent 11%,transparent 85%,rgba(0,0,0,.31)),linear-gradient(180deg,rgba(255,255,255,.08),transparent 15%),linear-gradient(180deg,var(--c1),var(--c2))!important;
            box-shadow:3px 5px 0 #120704,0 8px 11px rgba(0,0,0,.32),inset 0 0 10px rgba(0,0,0,.10)!important
          }
          #library .v5104-book:nth-child(1){flex-grow:1.16!important;height:96%!important}
          #library .v5104-book:nth-child(2){flex-grow:.92!important;height:88%!important}
          #library .v5104-book:nth-child(3){flex-grow:1.04!important;height:93%!important}
          #library .v5104-book:nth-child(4){flex-grow:1.10!important;height:98%!important}
          #library .v5104-book:nth-child(5){flex-grow:.92!important;height:91%!important}
          #library .v5104-book:nth-child(6){flex-grow:1.06!important;height:95%!important}
          #library .v5104-book:nth-child(7){flex-grow:.98!important;height:89%!important}
          #library .v5104-book::before{inset:8px 7px 25px!important;border:1px solid rgba(248,211,122,.56)!important;border-radius:7px 7px 2px 2px!important;box-shadow:inset 0 0 0 1px rgba(50,21,11,.18)!important}
          #library .v5104-book::after{left:9px!important;right:9px!important;bottom:25px!important;height:34px!important;background:linear-gradient(180deg,transparent 0 7%,rgba(240,198,102,.54) 7% 10%,transparent 10% 79%,rgba(240,198,102,.49) 79% 82%,transparent 82%)!important}
          #library .v5104-book-title{inset:36px 10px 63px!important;color:#f7e3ad!important;font:900 clamp(7.5px,1.5vw,11.4px)/1 Georgia,'Times New Roman',serif!important;letter-spacing:.08px!important;text-shadow:0 1px 1px #1d0c07,0 0 4px rgba(0,0,0,.25)!important}
          #library .v5104-book-icon{top:17px!important;bottom:auto!important;width:20px;height:20px;display:grid!important;place-items:center!important;color:#f0c86f!important;font-size:clamp(8px,1.7vw,12px)!important;text-shadow:0 1px 1px #1d0c07!important}
          #library .v5105-spine-crown{top:8px!important;color:#dcae52!important;font-size:5.8px!important;opacity:.9!important}
          #library .v5104-book-series{left:6px!important;right:6px!important;bottom:7px!important;height:15px!important;color:#edcf8c!important;background:linear-gradient(180deg,rgba(31,12,7,.22),rgba(10,4,3,.45))!important;border-top:1px solid rgba(242,202,109,.40)!important;border-bottom:1px solid rgba(8,3,2,.30)!important;font-size:clamp(4px,.84vw,6px)!important}
          #library .v5104-book-fav{right:8px!important;top:9px!important;font-size:8px!important;color:#ffe28a!important}
          #library .v5105-spine-bookmark{right:7px!important;top:-3px!important;height:31px!important}
          #library .v5104-book.selected{transform:translateY(-7px)!important;box-shadow:0 0 0 1px #f1cf7f,0 0 18px rgba(255,198,71,.38),3px 10px 0 #120704,0 13px 17px rgba(0,0,0,.35)!important}

          #library .v5104-detail-view{margin-top:8px!important}
          #library .v5104-detail-book{aspect-ratio:845/434!important;min-height:0!important;overflow:visible!important}
          #library .v5104-detail-left{left:6.3%!important;top:10.5%!important;width:37.1%!important;bottom:9.4%!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;gap:5px!important}
          #library .v5104-cover-frame{width:60%!important;max-height:72%!important;aspect-ratio:2/3!important;border-radius:3px!important;border:2px solid #29130c!important;outline:1px solid #bd8a49!important;outline-offset:-5px!important;box-shadow:3px 5px 0 rgba(43,20,11,.56),0 7px 10px rgba(0,0,0,.18)!important}
          #library .v5104-cover-placeholder{padding:8px!important}#library .v5104-cover-placeholder span{font-size:20px!important}#library .v5104-cover-placeholder b{font-size:6px!important;line-height:1.12!important}
          #library .v5104-cover-actions{width:72%!important;gap:3px!important;margin-top:1px!important}#library .v5104-cover-actions button{min-height:24px!important;padding:3px 5px!important;border-radius:6px!important;font-size:3.8px!important;box-shadow:0 3px 0 rgba(64,31,15,.25)!important}
          #library .v5104-detail-right{left:49.3%!important;right:7.7%!important;top:13.8%!important;bottom:10.4%!important;display:flex!important;flex-direction:column!important;min-width:0!important;color:#52351f!important}
          #library .v5104-entry{align-self:flex-start!important;padding:3px 8px!important;border-radius:999px!important;background:#8c5740!important;color:#f6dfb4!important;font-size:3.6px!important;letter-spacing:.3px!important;box-shadow:0 2px 0 rgba(74,35,20,.18)!important}
          #library .v5104-title{margin:6px 0 2px!important;max-width:100%!important;color:#4b2d1b!important;font:900 clamp(11px,2.65vw,18px)/1.02 Georgia,'Times New Roman',serif!important;white-space:normal!important;overflow-wrap:anywhere!important;display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important}
          #library .v5104-author{margin-top:0!important;color:#78553a!important;font:800 clamp(4.5px,1vw,6.3px)/1.15 ui-monospace,monospace!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
          #library .v5104-rating-row{margin-top:6px!important;min-height:22px!important;display:flex!important;align-items:center!important;gap:5px!important}
          #library .v5104-rating{padding:4px 8px!important;border-radius:7px!important;background:#59351f!important;border:1px solid #8c6337!important;color:#f6d481!important;font-size:5.6px!important}
          #library .v5104-favorite{margin-left:0!important;color:#9f6720!important;font-size:3.8px!important;white-space:nowrap!important}
          #library .v5104-ledger{display:grid!important;grid-template-columns:1fr 1fr!important;gap:5px!important;margin-top:6px!important}
          #library .v5104-ledger>div{min-height:38px!important;padding:5px 6px!important;border:1px solid rgba(159,114,63,.50)!important;border-radius:2px!important;background:rgba(255,247,222,.36)!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)!important}
          #library .v5104-ledger span{margin-bottom:3px!important;color:#876144!important;font-size:3.2px!important;letter-spacing:.15px!important}
          #library .v5104-ledger b{color:#493120!important;font-size:4.8px!important;line-height:1.1!important}
          #library .v5104-notes{margin-top:5px!important;max-height:36px!important;overflow:hidden!important;padding:5px 3px 4px!important;border-top:1px solid rgba(148,105,58,.35)!important;color:#654632!important;font:italic 700 4.1px/1.25 Georgia,'Times New Roman',serif!important}
          #library .v5104-notes b{font-style:normal!important;font-size:3.2px!important;letter-spacing:.15px!important}
          #library .v5104-detail-actions{left:0!important;right:0!important;bottom:0!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:5px!important}
          #library .v5104-detail-actions button{min-height:25px!important;padding:3px 4px!important;border-radius:7px!important;font-size:3.8px!important;box-shadow:0 3px 0 rgba(64,31,15,.22)!important}
          #library .v5104-detail-close{right:7.4%!important;top:8.4%!important;padding:4px 7px!important;border-radius:999px!important;background:#51301f!important;color:#ebcf98!important;border-color:#946738!important;font-size:3.4px!important}

          @media(max-width:420px){
            #library .v5104-shelf-row{min-height:300px!important;padding:23px 20px 34px!important}
            #library .v5104-books{left:7%!important;right:7%!important;gap:3px!important}
            #library .v5104-book{max-width:58px!important;border-radius:8px 8px 3px 3px / 7px 7px 3px 3px!important}
            #library .v5104-book-title{inset:34px 7px 58px!important;font-size:6.6px!important}
            #library .v5104-book-icon{top:16px!important;font-size:8px!important}
            #library .v5105-spine-crown{top:7px!important;font-size:5px!important}
            #library .v5104-book-series{left:5px!important;right:5px!important;height:13px!important;font-size:3.55px!important}
            #library .v5104-detail-left{left:6.1%!important;top:11.2%!important;width:37.5%!important;bottom:10%!important}
            #library .v5104-cover-frame{width:61%!important}
            #library .v5104-detail-right{left:49.6%!important;right:7.3%!important;top:14.4%!important;bottom:10.8%!important}
            #library .v5104-title{font-size:11.2px!important;line-height:1!important;margin-top:5px!important}
            #library .v5104-ledger>div{min-height:34px!important;padding:4px 5px!important}
            #library .v5104-ledger b{font-size:4.25px!important}
            #library .v5104-cover-actions button,#library .v5104-detail-actions button{font-size:3.35px!important;min-height:22px!important}
          }
          </style>
          '''

          if 'v5107-archive-visual-pass' not in text:
              text = text.replace('</head>', css + '\n</head>')

          p.write_text(text)

          sw = Path('service-worker.js')
          sw_text = sw.read_text().replace('reading-mmo-v5.10.6-visible-version-refresh', 'reading-mmo-v5.10.7-archive-visual-pass')
          sw.write_text(sw_text)

          Path('BUILD-NOTES-v5.10.7.txt').write_text('''Reading MMO v5.10.7 — Archive Visual Match Pass\n\n- Keeps the approved Enchanted Archive top/header/stats/search/filter composition unchanged.\n- Makes shelf books feel more like illustrated fantasy spines with richer leather depth, gold trim, varied width/height rhythm, stronger crests, and a cleaner selected-book state.\n- Repositions the open-book record so cover controls live naturally on the left page and title/author/rating/metadata/notes/actions sit cleanly on the right page.\n- Preserves all existing Archive functionality and saved library data.\n- App Health/header badge/service-worker cache bumped to v5.10.7.\n''')
          PY

      - name: Commit app update
        run: |
          git config user.name "Reading MMO updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html service-worker.js BUILD-NOTES-v5.10.7.txt
          git commit -m "Reading MMO v5.10.7 archive visual match pass"
          git push
