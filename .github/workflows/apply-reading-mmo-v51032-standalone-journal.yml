name: Promote Reading MMO v5.10.36

on:
  push:
    branches: [ main ]
    paths:
      - 'reading-journal-v51032.js'
      - 'reading-journal-mobile-v51035.js'
      - 'service-worker-v51033.js'
      - 'service-worker-v51036.js'
      - 'manifest.webmanifest'
      - '.github/workflows/apply-reading-mmo-v51032-standalone-journal.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote full app shell and journal to v5.10.36
        id: promote
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changed = []

          # 1) Promote the actual app shell version labels and runtime references.
          idx_path = Path('index.html')
          idx = idx_path.read_text()
          updated = idx

          updated = updated.replace(
              '<span id="headerVersionText" class="app-version-badge">v5.10.33</span>',
              '<span id="headerVersionText" class="app-version-badge">v5.10.36</span>',
          )
          updated = updated.replace(
              '<div class="health-row"><b>Version</b><span>v5.10.33</span></div>',
              '<div class="health-row"><b>Version</b><span>v5.10.36</span></div>',
          )
          updated = updated.replace(
              "window.__readingMmoVersionOwner='v5.10.33';",
              "window.__readingMmoVersionOwner='v5.10.36';",
          )

          for old in [
              './reading-journal-v51032.js?v=51033',
              './reading-journal-v51032.js?v=51034',
              './reading-journal-v51032.js?v=51035',
          ]:
              updated = updated.replace(old, './reading-journal-v51032.js?v=51036')

          for old in [
              './reading-journal-mobile-v51035.js?v=51035',
          ]:
              updated = updated.replace(old, './reading-journal-mobile-v51035.js?v=51036')

          for old in [
              './service-worker-v51033.js?v=51033',
              './service-worker-v51033.js?v=51034',
              './service-worker-v51033.js?v=51035',
              './service-worker-v51036.js?v=51035',
          ]:
              updated = updated.replace(old, './service-worker-v51036.js?v=51036')

          mobile_tag = '<script src="./reading-journal-mobile-v51035.js?v=51036"></script>'
          journal_tag = '<script src="./reading-journal-v51032.js?v=51036"></script>'
          if mobile_tag not in updated:
              if journal_tag not in updated:
                  raise SystemExit('could not find v5.10.36 Journal script tag')
              updated = updated.replace(journal_tag, journal_tag + '\n' + mobile_tag, 1)

          if updated != idx:
              idx_path.write_text(updated)
              changed.append('index.html')

          # 2) Promote the Journal build owner itself.
          journal_path = Path('reading-journal-v51032.js')
          journal = journal_path.read_text()
          j2 = journal.replace("const BUILD='v5.10.34'", "const BUILD='v5.10.36'")
          j2 = j2.replace("const BUILD='v5.10.35'", "const BUILD='v5.10.36'")
          if j2 != journal:
              journal_path.write_text(j2)
              changed.append('reading-journal-v51032.js')

          # 3) Upgrade the old worker in-place so stale installed copies can still escape 5.10.33/35.
          old_sw_path = Path('service-worker-v51033.js')
          old_sw = old_sw_path.read_text()
          sw = old_sw
          for old_cache in [
              "const CACHE = 'reading-mmo-v5.10.33-book-aware-reader-sync';",
              "const CACHE = 'reading-mmo-v5.10.34-reading-journal-v2';",
              "const CACHE = 'reading-mmo-v5.10.35-readable-journal-mobile';",
          ]:
              sw = sw.replace(old_cache, "const CACHE = 'reading-mmo-v5.10.36-shell-mobile-journal';")
          for old_force in [
              "const FORCE_VERSION = '51033';",
              "const FORCE_VERSION = '51034';",
              "const FORCE_VERSION = '51035';",
          ]:
              sw = sw.replace(old_force, "const FORCE_VERSION = '51036';")

          if "'./reading-journal-mobile-v51035.js'" not in sw:
              needle = "  './reading-journal-v51032.js',\n"
              if needle not in sw:
                  raise SystemExit('could not add mobile Journal to worker core')
              sw = sw.replace(needle, needle + "  './reading-journal-mobile-v51035.js',\n", 1)

          if sw != old_sw:
              old_sw_path.write_text(sw)
              changed.append('service-worker-v51033.js')

          # 4) Register a fresh worker URL for the current shell, while retaining the upgraded old worker above.
          fresh_sw_path = Path('service-worker-v51036.js')
          existing_fresh = fresh_sw_path.read_text() if fresh_sw_path.exists() else None
          if existing_fresh != sw:
              fresh_sw_path.write_text(sw)
              changed.append('service-worker-v51036.js')

          # 5) Future installed launches should request the current shell version directly.
          manifest_path = Path('manifest.webmanifest')
          manifest = manifest_path.read_text()
          m2 = manifest.replace('"start_url": "./",', '"start_url": "./?appv=51036",')
          m2 = m2.replace('"start_url": "./?appv=51035",', '"start_url": "./?appv=51036",')
          if m2 != manifest:
              manifest_path.write_text(m2)
              changed.append('manifest.webmanifest')

          Path('/tmp/promote_changed').write_text('true' if changed else 'false')
          print('changed:', ', '.join(changed) if changed else 'none')
          PY
          echo "changed=$(cat /tmp/promote_changed)" >> "$GITHUB_OUTPUT"

      - name: Commit v5.10.36 shell promotion
        if: steps.promote.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reading-journal-v51032.js service-worker-v51033.js service-worker-v51036.js manifest.webmanifest
          git commit -m "Activate Reading MMO v5.10.36 shell and readable Journal"
          git push origin HEAD:main

      - name: Request fresh Pages build
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Verify JavaScript syntax
        run: |
          node --check reading-journal-v51032.js
          node --check reading-journal-mobile-v51035.js
          node --check service-worker-v51033.js
          node --check service-worker-v51036.js

      - name: Verify v5.10.36 full shell runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          idx = Path('index.html').read_text()
          journal = Path('reading-journal-v51032.js').read_text()
          mobile = Path('reading-journal-mobile-v51035.js').read_text()
          sw_old = Path('service-worker-v51033.js').read_text()
          sw_new = Path('service-worker-v51036.js').read_text()
          manifest = Path('manifest.webmanifest').read_text()

          for check in [
              'app-version-badge">v5.10.36',
              '<b>Version</b><span>v5.10.36</span>',
              "window.__readingMmoVersionOwner='v5.10.36'",
              'reading-journal-v51032.js?v=51036',
              'reading-journal-mobile-v51035.js?v=51036',
              'service-worker-v51036.js?v=51036',
          ]:
              if check not in idx:
                  raise SystemExit(f'missing v5.10.36 app-shell wiring: {check}')

          for check in [
              "const BUILD='v5.10.36'",
              'READING TIMELINE',
              'THE COMPLETE LEDGER',
              'MOST-READ BOOK',
              'window.openReadingJournal',
          ]:
              if check not in journal:
                  raise SystemExit(f'missing Journal behavior: {check}')

          for check in [
              '@media (max-width: 700px)',
              'grid-template-columns:repeat(2,minmax(0,1fr))',
              'font-size:15.5px',
              'font:900 12px/1.15 ui-monospace,monospace!important',
          ]:
              if check not in mobile:
                  raise SystemExit(f'missing readable mobile CSS: {check}')

          for sw in [sw_old, sw_new]:
              for check in [
                  "reading-mmo-v5.10.36-shell-mobile-journal",
                  "FORCE_VERSION = '51036'",
                  "'./reading-journal-v51032.js'",
                  "'./reading-journal-mobile-v51035.js'",
              ]:
                  if check not in sw:
                      raise SystemExit(f'missing v5.10.36 worker wiring: {check}')

          if '"start_url": "./?appv=51036"' not in manifest:
              raise SystemExit('manifest does not launch v5.10.36')
          PY
