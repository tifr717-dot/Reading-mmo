name: Validate Reading Journal v5.10.34

on:
  push:
    branches: [ main ]
    paths:
      - 'reading-journal-v51032.js'
      - 'service-worker-v51033.js'
      - '.github/workflows/apply-reading-mmo-v51032-standalone-journal.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote v5.10.34 runtime cache-busters
        id: promote
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()
          updated = text.replace(
              './reading-journal-v51032.js?v=51033',
              './reading-journal-v51032.js?v=51034',
          ).replace(
              './service-worker-v51033.js?v=51033',
              './service-worker-v51033.js?v=51034',
          )
          changed = updated != text
          if changed:
              path.write_text(updated)
          with open('/tmp/cache_buster_changed', 'w') as f:
              f.write('true' if changed else 'false')
          PY
          echo "changed=$(cat /tmp/cache_buster_changed)" >> "$GITHUB_OUTPUT"

      - name: Commit cache-buster repair
        if: steps.promote.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix v5.10.34 runtime cache-busters"
          git push origin HEAD:main

      - name: Request fresh Pages build
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Verify journal and service worker syntax
        run: |
          node --check reading-journal-v51032.js
          node --check service-worker-v51033.js

      - name: Verify v5.10.34 journal runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          idx = Path('index.html').read_text()
          journal = Path('reading-journal-v51032.js').read_text()
          sw = Path('service-worker-v51033.js').read_text()

          for check in [
              'reading-journal-v51032.js?v=51034',
              'service-worker-v51033.js?v=51034',
          ]:
              if check not in idx:
                  raise SystemExit(f'missing live app runtime reference: {check}')

          for check in [
              "const BUILD='v5.10.34'",
              'readingSessions',
              'appState()?.library',
              'READING TIMELINE',
              'THE COMPLETE LEDGER',
              'MOST-READ BOOK',
              'CrossInk',
              'window.openReadingJournal',
          ]:
              if check not in journal:
                  raise SystemExit(f'missing v5.10.34 journal behavior: {check}')

          for check in [
              "reading-mmo-v5.10.34-reading-journal-v2",
              "FORCE_VERSION = '51034'",
              "'./reading-journal-v51032.js'",
              "'./reading-ble-v51033.js'",
          ]:
              if check not in sw:
                  raise SystemExit(f'missing v5.10.34 cache wiring: {check}')
          PY
