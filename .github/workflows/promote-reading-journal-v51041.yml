name: Promote Reading Journal v5.10.41

on:
  push:
    branches: [ main ]
    paths:
      - 'reading-journal-art-v51041.js'
      - 'journal-botanical-corner-v51041.svg'
      - 'journal-flourish-v51041.svg'
      - 'journal-icon-sessions-v51041.svg'
      - 'journal-icon-pages-v51041.svg'
      - 'journal-icon-time-v51041.svg'
      - 'journal-icon-longest-v51041.svg'
      - '.github/workflows/promote-reading-journal-v51041.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote illustrated Archivist Journal to v5.10.41
        id: promote
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]

          idxp=Path('index.html')
          idx=idxp.read_text(); out=idx
          out=out.replace('app-version-badge">v5.10.40','app-version-badge">v5.10.41')
          out=out.replace('<b>Version</b><span>v5.10.40</span>','<b>Version</b><span>v5.10.41</span>')
          out=out.replace("window.__readingMmoVersionOwner='v5.10.40'","window.__readingMmoVersionOwner='v5.10.41'")
          for name in ['reading-journal-v51032.js','reading-journal-mobile-v51035.js','reading-journal-cascade-v51038.js','reading-journal-polish-v51039.js','reading-journal-visual-v51040.js']:
              out=out.replace(f'./{name}?v=51040',f'./{name}?v=51041')
          out=out.replace('./service-worker-v51040.js?v=51040','./service-worker-v51041.js?v=51041')

          visual='<script src="./reading-journal-visual-v51040.js?v=51041"></script>'
          art='<script src="./reading-journal-art-v51041.js?v=51041"></script>'
          if art not in out:
              if visual not in out: raise SystemExit('could not find v5.10.40 visual script')
              out=out.replace(visual,visual+'\n'+art,1)
          if out!=idx:
              idxp.write_text(out);changed.append('index.html')

          jp=Path('reading-journal-v51032.js')
          j=jp.read_text(); j2=j.replace("const BUILD='v5.10.40'","const BUILD='v5.10.41'")
          if j2!=j:
              jp.write_text(j2);changed.append(str(jp))

          swp=Path('service-worker-v51040.js')
          sw=swp.read_text(); sw2=sw
          sw2=sw2.replace("const CACHE = 'reading-mmo-v5.10.40-archivist-visual-polish';","const CACHE = 'reading-mmo-v5.10.41-illustrated-archivist-journal';")
          sw2=sw2.replace("const FORCE_VERSION = '51040';","const FORCE_VERSION = '51041';")
          assets=[
            './reading-journal-art-v51041.js',
            './journal-botanical-corner-v51041.svg',
            './journal-flourish-v51041.svg',
            './journal-icon-sessions-v51041.svg',
            './journal-icon-pages-v51041.svg',
            './journal-icon-time-v51041.svg',
            './journal-icon-longest-v51041.svg',
          ]
          needle="  './reading-journal-visual-v51040.js',\n"
          if needle not in sw2: raise SystemExit('could not find v5.10.40 visual cache entry')
          insertion=''.join(f"  '{a}',\n" for a in assets if f"'{a}'" not in sw2)
          if insertion:
              sw2=sw2.replace(needle,needle+insertion,1)
          if sw2!=sw:
              swp.write_text(sw2);changed.append(str(swp))

          fresh=Path('service-worker-v51041.js')
          if not fresh.exists() or fresh.read_text()!=sw2:
              fresh.write_text(sw2);changed.append(str(fresh))

          mp=Path('manifest.webmanifest')
          m=mp.read_text(); m2=m.replace('"start_url": "./?appv=51040"','"start_url": "./?appv=51041"')
          if m2!=m:
              mp.write_text(m2);changed.append(str(mp))

          Path('/tmp/changed').write_text('true' if changed else 'false')
          print('changed:', ', '.join(changed) if changed else 'none')
          PY
          echo "changed=$(cat /tmp/changed)" >> "$GITHUB_OUTPUT"

      - name: Commit v5.10.41 runtime
        if: steps.promote.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reading-journal-v51032.js reading-journal-art-v51041.js journal-botanical-corner-v51041.svg journal-flourish-v51041.svg journal-icon-sessions-v51041.svg journal-icon-pages-v51041.svg journal-icon-time-v51041.svg journal-icon-longest-v51041.svg service-worker-v51040.js service-worker-v51041.js manifest.webmanifest
          git commit -m "Activate Reading MMO v5.10.41 illustrated Archivist Journal"
          git push origin HEAD:main

      - name: Request fresh Pages build
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Verify runtime syntax and illustrated assets
        run: |
          node --check reading-journal-v51032.js
          node --check reading-journal-art-v51041.js
          node --check service-worker-v51040.js
          node --check service-worker-v51041.js
          test -s journal-botanical-corner-v51041.svg
          test -s journal-flourish-v51041.svg
          test -s journal-icon-sessions-v51041.svg
          test -s journal-icon-pages-v51041.svg
          test -s journal-icon-time-v51041.svg
          test -s journal-icon-longest-v51041.svg

      - name: Verify v5.10.41 illustrated runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          art=Path('reading-journal-art-v51041.js').read_text()
          sw=Path('service-worker-v51041.js').read_text()
          manifest=Path('manifest.webmanifest').read_text()
          checks=[
            ('index version','app-version-badge">v5.10.41' in idx),
            ('art script','reading-journal-art-v51041.js?v=51041' in idx),
            ('worker registration','service-worker-v51041.js?v=51041' in idx),
            ('bookplate selector','journal-flourish-v51041.svg' in art and '.v51034-book-select' in art),
            ('illustrated stats','journal-icon-sessions-v51041.svg' in art and 'journal-icon-pages-v51041.svg' in art),
            ('paper slips','clip-path:polygon' in art and '.v51034-entry-main' in art),
            ('wax seal','.v51034-source.crossink' in art and 'radial-gradient' in art),
            ('filter scroll reset','body.scrollTop=0' in art),
            ('worker cache',"reading-mmo-v5.10.41-illustrated-archivist-journal" in sw and "FORCE_VERSION = '51041'" in sw),
            ('art cached',"'./reading-journal-art-v51041.js'" in sw),
            ('botanical cached',"'./journal-botanical-corner-v51041.svg'" in sw),
            ('manifest','"start_url": "./?appv=51041"' in manifest),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad: raise SystemExit('missing: '+', '.join(bad))
          PY
