name: Apply Reading MMO v5.10.22 Pixel Archive

on:
  push:
    paths:
      - '.github/workflows/apply-reading-mmo-v51022-pixel-archive.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pixel archive concept match
        shell: python
        run: |
          from pathlib import Path

          shelf = r'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" shape-rendering="crispEdges" role="img" aria-label="Pixel art carved fantasy bookshelf">
          <defs>
            <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#3a1d10"/><rect x="0" y="0" width="16" height="5" fill="#4c2916"/><rect x="18" y="8" width="14" height="5" fill="#2a120b"/><rect x="5" y="19" width="20" height="4" fill="#5b321b"/><rect x="25" y="25" width="7" height="7" fill="#1d0b07"/></pattern>
          </defs>
          <rect width="1000" height="560" fill="#160906"/>
          <rect x="20" y="20" width="960" height="520" fill="#24100a" stroke="#160805" stroke-width="12"/>
          <rect x="30" y="30" width="940" height="500" fill="url(#grain)" stroke="#7d4925" stroke-width="8"/>
          <rect x="40" y="42" width="920" height="66" fill="#4c2815"/><rect x="40" y="42" width="920" height="12" fill="#9b6230"/><rect x="40" y="96" width="920" height="12" fill="#211008"/>
          <rect x="48" y="112" width="50" height="382" fill="#3b1a0e"/><rect x="58" y="112" width="14" height="382" fill="#8f5428"/><rect x="84" y="112" width="14" height="382" fill="#1c0b07"/>
          <rect x="902" y="112" width="50" height="382" fill="#3b1a0e"/><rect x="912" y="112" width="14" height="382" fill="#8f5428"/><rect x="938" y="112" width="14" height="382" fill="#1c0b07"/>
          <rect x="40" y="470" width="920" height="58" fill="#5b321b"/><rect x="40" y="470" width="920" height="11" fill="#b17138"/><rect x="40" y="517" width="920" height="11" fill="#2a120b"/>
          <rect x="88" y="114" width="824" height="356" fill="#120806"/><rect x="96" y="124" width="808" height="338" fill="#1d0d08"/>
          <!-- pixel ivy -->
          <g fill="#26411e"><rect x="34" y="28" width="18" height="18"/><rect x="50" y="20" width="18" height="18"/><rect x="66" y="34" width="18" height="18"/><rect x="84" y="24" width="18" height="18"/><rect x="102" y="38" width="18" height="18"/><rect x="880" y="28" width="18" height="18"/><rect x="898" y="18" width="18" height="18"/><rect x="916" y="34" width="18" height="18"/><rect x="934" y="24" width="18" height="18"/></g>
          <g fill="#49612b"><rect x="48" y="30" width="14" height="14"/><rect x="78" y="22" width="14" height="14"/><rect x="108" y="34" width="14" height="14"/><rect x="892" y="28" width="14" height="14"/><rect x="922" y="20" width="14" height="14"/></g>
          <!-- left lantern -->
          <g transform="translate(62 322)"><rect x="0" y="0" width="34" height="70" fill="#1a120d" stroke="#8d6330" stroke-width="5"/><rect x="7" y="12" width="20" height="38" fill="#d38b33"/><rect x="10" y="16" width="14" height="30" fill="#ffd070"/><rect x="5" y="-12" width="24" height="12" fill="#2a180f"/><rect x="8" y="70" width="18" height="8" fill="#2a180f"/></g>
          <!-- plant -->
          <g transform="translate(42 414)"><rect x="8" y="48" width="48" height="32" fill="#6d3a1d"/><rect x="15" y="40" width="34" height="12" fill="#9b5d2b"/><g fill="#385323"><rect x="0" y="18" width="24" height="18"/><rect x="18" y="0" width="20" height="20"/><rect x="36" y="14" width="24" height="18"/><rect x="10" y="28" width="20" height="18"/><rect x="32" y="30" width="22" height="18"/></g></g>
          <!-- right stacked books, quill, crystal -->
          <g transform="translate(864 382)"><rect x="0" y="70" width="92" height="16" fill="#5a2f25" stroke="#bd7f43" stroke-width="3"/><rect x="10" y="54" width="82" height="16" fill="#24485a" stroke="#a97b3d" stroke-width="3"/><rect x="0" y="38" width="88" height="16" fill="#6b5220" stroke="#b98b45" stroke-width="3"/><rect x="64" y="0" width="10" height="46" fill="#e5c990" transform="rotate(22 69 23)"/><rect x="55" y="14" width="10" height="30" fill="#f3dfa9" transform="rotate(22 60 29)"/><rect x="78" y="18" width="18" height="24" fill="#4e2c61" stroke="#d8b36c" stroke-width="3"/></g>
          <!-- tiny purple flowers -->
          <g fill="#7d4b91"><rect x="28" y="452" width="12" height="12"/><rect x="42" y="442" width="12" height="12"/><rect x="936" y="118" width="12" height="12"/><rect x="946" y="132" width="12" height="12"/></g>
          </svg>'''

          def motif(kind):
              return {
                  '6':'<rect x="72" y="48" width="16" height="16"/><rect x="64" y="56" width="32" height="16"/><rect x="72" y="72" width="16" height="16"/><rect x="56" y="64" width="16" height="16"/><rect x="88" y="64" width="16" height="16"/>',
                  '5':'<rect x="54" y="58" width="52" height="22" rx="2"/><rect x="64" y="50" width="34" height="18"/><rect x="60" y="84" width="8" height="14"/><rect x="78" y="84" width="8" height="14"/><rect x="96" y="84" width="8" height="14"/>',
                  '4':'<rect x="52" y="52" width="10" height="54" transform="rotate(-45 57 79)"/><rect x="98" y="52" width="10" height="54" transform="rotate(45 103 79)"/><rect x="72" y="66" width="16" height="16"/>',
                  '3':'<rect x="72" y="44" width="16" height="16"/><rect x="56" y="60" width="48" height="16"/><rect x="64" y="76" width="32" height="16"/><rect x="72" y="92" width="16" height="14"/>',
                  '2':'<path d="M92 44H72V52H64V76H72V84H96V76H82V68H76V52H92Z"/>',
                  '1':'<path d="M80 42L98 70V86Q98 106 80 106Q62 106 62 86V70Z"/><rect x="108" y="48" width="12" height="12"/><rect x="104" y="52" width="20" height="4"/><rect x="112" y="44" width="4" height="20"/>',
                  'standalone':'<rect x="62" y="48" width="36" height="28"/><rect x="56" y="56" width="12" height="20"/><rect x="92" y="56" width="12" height="20"/><rect x="68" y="60" width="8" height="8" fill="#2a1630"/><rect x="84" y="60" width="8" height="8" fill="#2a1630"/><rect x="74" y="74" width="12" height="4" fill="#2a1630"/>'
              }[kind]

          def spine(kind, base, dark, hi):
              return f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 560" shape-rendering="crispEdges" role="img" aria-label="Pixel art fantasy book spine">
              <rect x="8" y="18" width="144" height="530" fill="#160a07"/>
              <rect x="16" y="10" width="128" height="530" fill="{dark}"/>
              <rect x="24" y="18" width="112" height="514" fill="{base}"/>
              <rect x="24" y="18" width="14" height="514" fill="{hi}" opacity=".38"/>
              <rect x="122" y="18" width="14" height="514" fill="#000" opacity=".22"/>
              <rect x="30" y="28" width="100" height="8" fill="#d5a74f"/><rect x="30" y="42" width="100" height="4" fill="#7a4a1e"/>
              <rect x="30" y="112" width="100" height="5" fill="#d5a74f"/><rect x="30" y="430" width="100" height="5" fill="#d5a74f"/>
              <rect x="30" y="488" width="100" height="8" fill="#d5a74f"/><rect x="42" y="130" width="5" height="282" fill="#c89442" opacity=".85"/><rect x="113" y="130" width="5" height="282" fill="#c89442" opacity=".85"/>
              <g fill="#e5bd66">{motif(kind)}</g>
              <rect x="36" y="452" width="88" height="8" fill="#7a4a1e"/><rect x="36" y="462" width="88" height="4" fill="#d5a74f"/>
              <rect x="34" y="500" width="92" height="30" fill="{dark}" stroke="#d7aa56" stroke-width="4"/>
              </svg>'''

          palettes={
              '6':('#9b6b22','#4c2e0e','#e0b452'),
              '5':('#5f5d4b','#29271f','#aaa17a'),
              '4':('#1f5d82','#123448','#4d9cc4'),
              '3':('#24684f','#123a2e','#4f9b73'),
              '2':('#603d86','#2c1b44','#8e63b8'),
              '1':('#8c332d','#451815','#c86050'),
              'standalone':('#653675','#32183d','#9255a5')
          }
          Path('archive-pixel-shelf-v51022.svg').write_text(shelf,encoding='utf-8')
          for k,p in palettes.items(): Path(f'archive-pixel-spine-{k}-v51022.svg').write_text(spine(k,*p),encoding='utf-8')

          css=r'''/* Reading MMO v5.10.22 — pixel archive concept match. */
          #library .v51011-shelf-row{
            height:372px!important;margin:10px 0 18px!important;overflow:hidden!important;
            border:0!important;border-radius:0!important;background:url('./archive-pixel-shelf-v51022.svg?v=51022') center/100% 100% no-repeat!important;
            box-shadow:0 12px 18px rgba(0,0,0,.42)!important;image-rendering:pixelated!important;
          }
          #library .v51011-shelf-row:before,#library .v51011-shelf-row:after,#library .v51011-side-post,#library .v51011-shelf-lantern,#library .v51011-shelf-books{display:none!important}
          #library .v51011-books{left:12.5%!important;right:10.5%!important;top:78px!important;bottom:58px!important;gap:1px!important;align-items:flex-end!important;justify-content:center!important;z-index:4!important}
          #library .v51022-spine{position:relative!important;flex:1 1 0!important;min-width:0!important;max-width:72px!important;height:94%!important;padding:0!important;margin:0!important;border:0!important;background:transparent!important;box-shadow:none!important;overflow:visible!important;transform-origin:50% 100%!important;image-rendering:pixelated!important;isolation:isolate!important}
          #library .v51022-spine.k6{height:98%!important}#library .v51022-spine.k5{height:94%!important}#library .v51022-spine.k4{height:96%!important}#library .v51022-spine.k3{height:99%!important}#library .v51022-spine.k2{height:95%!important}#library .v51022-spine.k1{height:91%!important}#library .v51022-spine.kstandalone{height:89%!important}
          #library .v51022-spine-asset{position:absolute!important;inset:-3px -4px -4px!important;width:calc(100% + 8px)!important;height:calc(100% + 7px)!important;object-fit:fill!important;z-index:1!important;pointer-events:none!important;image-rendering:pixelated!important;filter:drop-shadow(3px 6px 0 rgba(5,2,1,.55))!important}
          #library .v51022-spine-title{position:absolute!important;z-index:4!important;left:50%!important;top:74px!important;bottom:57px!important;transform:translateX(-50%) rotate(180deg)!important;writing-mode:vertical-rl!important;text-orientation:mixed!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;max-width:26px!important;color:#f7df9d!important;font:900 clamp(8.5px,1.82vw,12px)/1 Georgia,'Times New Roman',serif!important;letter-spacing:.18px!important;text-shadow:1px 1px 0 #3a1a0d,-1px 0 #3a1a0d!important;pointer-events:none!important}
          #library .v51022-spine-series{position:absolute!important;z-index:5!important;left:8px!important;right:8px!important;bottom:13px!important;min-height:18px!important;display:grid!important;place-items:center!important;color:#f1c968!important;background:rgba(30,12,7,.58)!important;border:0!important;border-radius:0!important;font:900 clamp(5px,.96vw,6.8px)/1 ui-monospace,monospace!important;letter-spacing:.05px!important;text-shadow:1px 1px 0 #2b0f08!important;pointer-events:none!important}
          #library .v51022-spine-fav{position:absolute!important;z-index:7!important;right:3px!important;top:13px!important;width:19px!important;height:19px!important;display:grid!important;place-items:center!important;color:#ffe58c!important;background:#382016!important;border:3px solid #c68c3f!important;border-radius:0!important;font-size:9px!important;box-shadow:2px 2px 0 #120805!important}
          #library .v51022-spine-bookmark{display:none!important;position:absolute!important;z-index:8!important;right:5px!important;top:-3px!important;width:10px!important;height:38px!important;background:#9c3c31!important;border-left:2px solid #df9f4a!important;border-right:2px solid #df9f4a!important;clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%)!important}
          #library .v51022-spine.selected .v51022-spine-bookmark{display:block!important}#library .v51022-spine.selected{transform:translateY(-7px)!important;filter:brightness(1.12)!important}#library .v51022-spine.selected:after{content:""!important;position:absolute!important;inset:1px!important;z-index:0!important;box-shadow:0 0 0 3px #d7a64f,0 0 0 6px rgba(72,42,20,.72)!important;pointer-events:none!important}
          @media(max-width:420px){#library .v51011-shelf-row{height:344px!important}#library .v51011-books{left:12.2%!important;right:10.2%!important;top:72px!important;bottom:54px!important}#library .v51022-spine{max-width:56px!important}#library .v51022-spine-title{top:67px!important;bottom:53px!important;font-size:8px!important}#library .v51022-spine-series{left:4px!important;right:4px!important;bottom:11px!important;min-height:16px!important;font-size:4.4px!important}}
          @media(max-width:365px){#library .v51011-shelf-row{height:326px!important}#library .v51022-spine-title{top:63px!important;bottom:49px!important;font-size:7.4px!important}#library .v51022-spine-series{font-size:4px!important}}
          '''
          Path('archive-v51022.css').write_text(css,encoding='utf-8')

          js=r'''/* Reading MMO v5.10.22 — pixel archive shelf runtime. */
          (function(){
            const BUILD='v5.10.22'; window.__readingMmoVersionOwner=BUILD;
            const safe=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
            function ensureCss(){let l=document.getElementById('archive-v51022-css');if(!l){l=document.createElement('link');l.id='archive-v51022-css';l.rel='stylesheet';document.head.appendChild(l)}l.href='./archive-v51022.css?v=51022'}
            function stamp(){const b=document.getElementById('headerVersionText');if(b)b.textContent=BUILD;document.querySelectorAll('.health-row').forEach(r=>{if(r.querySelector('b')?.textContent.trim()==='Version'){const s=r.querySelector('span');if(s)s.textContent=BUILD}})}
            window.libraryBookCardMarkup=function(b,volumeNo){
              const series=window.librarySeriesShort?window.librarySeriesShort(b.series):String(b.series||'Standalone');
              const key=series==='#6'?'6':series==='#5'?'5':series==='#4'?'4':series==='#3'?'3':series==='#2'?'2':series==='#1'?'1':'standalone';
              const selected=String(window.__archiveSelectedId||'')===String(b.id)?' selected':'';
              const sid=String(b.id||'').replace(/'/g,"\\'");
              return `<button class="v51022-spine k${key}${selected}" onclick="window.__archiveSelectedId='${sid}';openLibraryRecord('${sid}')" aria-label="Open library record for ${safe(b.title)} by ${safe(b.author||'Unknown author')}"><img class="v51022-spine-asset" src="./archive-pixel-spine-${key}-v51022.svg?v=51022" alt="" aria-hidden="true">${b.favorite?'<span class="v51022-spine-fav">★</span>':''}<span class="v51022-spine-bookmark" aria-hidden="true"></span><span class="v51022-spine-title">${safe(b.title)}</span><span class="v51022-spine-series">${safe(series)}</span></button>`;
            };
            function apply(){ensureCss();stamp();if(typeof window.renderLibrary==='function')window.renderLibrary();[60,180,650,1300,2600].forEach(ms=>setTimeout(stamp,ms));}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();
          })();'''
          Path('archive-v51022.js').write_text(js,encoding='utf-8')

          notes='''Reading MMO v5.10.22 — Pixel Archive Concept Match\n\n- Rebuilds the Archive shelf as a chunky pixel-art carved wooden alcove matching the approved phone concept and existing widget language.\n- Converts all seven archive books to pixel-art image assets with live title and series text overlays.\n- Adds pixel lantern, plant, ivy, stacked books, quill, crystal, heavy wood beams, and crisp game-art shadows to the shelf asset.\n- Keeps Archive functionality, filters, record opening, cover data, and the open-book record intact.\n- Preserves Shelved Volumes and bumps Android service-worker cache/version to 5.10.22.\n'''
          Path('BUILD-NOTES-v5.10.22.txt').write_text(notes,encoding='utf-8')

          indexp=Path('index.html'); index=indexp.read_text(encoding='utf-8')
          index=index.replace("window.__readingMmoVersionOwner='v5.10.21';","window.__readingMmoVersionOwner='v5.10.22';")
          anchor='<script src="./reading-shelf-v51021.js?v=51021"></script>'
          if 'archive-v51022.js' not in index:
              if anchor not in index: raise SystemExit('reading shelf script anchor missing')
              index=index.replace(anchor,anchor+'\n<script src="./archive-v51022.js?v=51022"></script>',1)
          index=index.replace('service-worker.js?v=51021"','service-worker.js?v=51022"')
          indexp.write_text(index,encoding='utf-8')

          rsp=Path('reading-shelf-v51021.js'); rs=rsp.read_text(encoding='utf-8')
          rs=rs.replace("const BUILD='v5.10.21';\n  window.__readingMmoVersionOwner=BUILD;","const BUILD=window.__readingMmoVersionOwner||'v5.10.21';\n  window.__readingMmoVersionOwner=BUILD;")
          rsp.write_text(rs,encoding='utf-8')

          swp=Path('service-worker.js'); sw=swp.read_text(encoding='utf-8')
          import re
          sw=re.sub(r"const CACHE = '[^']+';","const CACHE = 'reading-mmo-v5.10.22-pixel-archive-concept-match';",sw,count=1)
          sw=re.sub(r"const FORCE_VERSION = '[^']+';","const FORCE_VERSION = '51022';",sw,count=1)
          marker="  './archive-v51018.js',"
          adds="  './archive-v51018.js',\n  './archive-v51022.css',\n  './archive-v51022.js',\n  './archive-pixel-shelf-v51022.svg',\n  './archive-pixel-spine-6-v51022.svg',\n  './archive-pixel-spine-5-v51022.svg',\n  './archive-pixel-spine-4-v51022.svg',\n  './archive-pixel-spine-3-v51022.svg',\n  './archive-pixel-spine-2-v51022.svg',\n  './archive-pixel-spine-1-v51022.svg',\n  './archive-pixel-spine-standalone-v51022.svg',"
          if "'./archive-v51022.js'" not in sw:
              if marker not in sw: raise SystemExit('service worker archive anchor missing')
              sw=sw.replace(marker,adds,1)
          swp.write_text(sw,encoding='utf-8')

      - name: Verify pixel archive wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'archive-v51022.js?v=51022' index.html
          grep -q 'service-worker.js?v=51022' index.html
          grep -q "reading-mmo-v5.10.22-pixel-archive-concept-match" service-worker.js
          grep -q 'archive-pixel-shelf-v51022.svg' service-worker.js
          grep -q 'v51022-spine' archive-v51022.css
          grep -q "BUILD='v5.10.22'" archive-v51022.js
          test -s archive-pixel-spine-6-v51022.svg
          test -s archive-pixel-spine-standalone-v51022.svg

      - name: Commit v5.10.22 pixel archive concept match
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js reading-shelf-v51021.js archive-v51022.css archive-v51022.js archive-pixel-shelf-v51022.svg archive-pixel-spine-*-v51022.svg BUILD-NOTES-v5.10.22.txt
          git commit -m 'Reading MMO v5.10.22 pixel archive concept match'
          git push