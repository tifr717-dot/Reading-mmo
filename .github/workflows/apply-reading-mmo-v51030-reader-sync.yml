name: Apply Reading MMO v5.10.30 Reader BLE Sync

on:
  push:
    branches: [ main ]
    paths:
      - 'reading-ble-v51030.js'
      - '.github/workflows/apply-reading-mmo-v51030-reader-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify reader sync runtime syntax
        run: node --check reading-ble-v51030.js

      - name: Integrate v5.10.30 reader sync runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          CACHE_GEN = '51030p2'
          p = Path('index.html')
          s = p.read_text()

          old_owner = "window.__readingMmoVersionOwner='v5.10.29';"
          new_owner = "window.__readingMmoVersionOwner='v5.10.30';"
          if old_owner not in s and new_owner not in s:
              raise SystemExit('v5.10.29 version owner anchor not found')
          s = s.replace(old_owner, new_owner)

          # The original v5.10.30 release and the Phase 2 receiver used the same
          # asset URLs, so an installed PWA could retain the Phase 1 JS while the
          # shell already displayed v5.10.30. Give every runtime asset a fresh,
          # idempotent cache generation without changing the visible app version.
          s = re.sub(r'\?v=51029(?![A-Za-z0-9])', f'?v={CACHE_GEN}', s)
          s = re.sub(r'\?v=51030(?![A-Za-z0-9])', f'?v={CACHE_GEN}', s)

          flow = f'<script src="./reading-flow-v51029.js?v={CACHE_GEN}"></script>'
          ble = f'<script src="./reading-ble-v51030.js?v={CACHE_GEN}"></script>'
          if ble not in s:
              if flow not in s:
                  raise SystemExit('v5.10.29 flow script anchor not found')
              s = s.replace(flow, flow + '\n' + ble, 1)

          s = s.replace("u.searchParams.set('appv','51029')", f"u.searchParams.set('appv','{CACHE_GEN}')")
          s = s.replace('u.searchParams.set("appv","51029")', f'u.searchParams.set("appv","{CACHE_GEN}")')
          s = s.replace("u.searchParams.set('appv','51030')", f"u.searchParams.set('appv','{CACHE_GEN}')")
          s = s.replace('u.searchParams.set("appv","51030")', f'u.searchParams.set("appv","{CACHE_GEN}")')

          # Health and header badges have historically had separate version owners.
          s = s.replace('<div class="health-row"><b>Version</b><span>v5.10.29</span></div>',
                        '<div class="health-row"><b>Version</b><span>v5.10.30</span></div>')
          s = re.sub(r'(<span id="headerVersionText" class="app-version-badge">)v[^<]+(</span>)',
                     r'\1v5.10.30\2', s)

          # Force the service-worker registration URL itself onto the new cache
          # generation. This makes Android install/update the Phase 2 worker even
          # when an older v5.10.30 worker is currently controlling the PWA.
          s = re.sub(r'service-worker-v51030\.js\?v=[^"\']+',
                     f'service-worker-v51030.js?v={CACHE_GEN}', s)

          p.write_text(s)

          # v5.10.29's session-flow module is intentionally still reused by 5.10.30,
          # but it must not take ownership of the visible app version.
          fp = Path('reading-flow-v51029.js')
          flow_src = fp.read_text()
          old_build = "const BUILD='v5.10.29';"
          new_build = "const BUILD=window.__readingMmoVersionOwner||'v5.10.29';"
          if old_build in flow_src:
              flow_src = flow_src.replace(old_build, new_build, 1)
          elif new_build not in flow_src:
              raise SystemExit('v5.10.29 flow version-owner anchor not found')
          fp.write_text(flow_src)
          PY

      - name: Create v5.10.30 service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          CACHE_GEN = '51030p2'
          src = Path('service-worker-v51029.js').read_text()
          src = src.replace('reading-mmo-v5.10.29-session-quest-flow', 'reading-mmo-v5.10.30-reader-sync-phase2-import-p2')
          src = src.replace("const FORCE_VERSION = '51029';", f"const FORCE_VERSION = '{CACHE_GEN}';")

          flow = "  './reading-flow-v51029.js',"
          ble = "  './reading-ble-v51030.js',"
          if ble not in src:
              if flow not in src:
                  raise SystemExit('service worker flow CORE anchor not found')
              src = src.replace(flow, flow + '\n' + ble, 1)

          Path('service-worker-v51030.js').write_text(src)
          PY
          node --check service-worker-v51030.js

      - name: Write v5.10.30 build notes
        run: |
          cat > BUILD-NOTES-v5.10.30.txt <<'EOF'
          Reading MMO v5.10.30 — CrossInk BLE Phase 2 Session Import

          - Keeps the SYNC READER control on the Home Reading panel.
          - Uses Android/Chrome Web Bluetooth to discover Reading MMO Reader.
          - Connects to service 7d2ea28a-f7bd-485a-bd9d-92ad6ecfe93e.
          - Reads characteristic 7d2ea28b-f7bd-485a-bd9d-92ad6ecfe93e.
          - Accepts Phase 2 payloads with sid, start page, end page, pages read, and reading seconds.
          - Handles the Phase 2 no-session payload without changing app state.
          - Previews a real reader session before the user chooses IMPORT SESSION.
          - Imports exact reader pages and reading time through the existing Reading MMO session/quest accounting path.
          - Updates current-book page/percent when the reader reports an end page.
          - Refuses to merge into an already-active in-app reading session.
          - Stores a session fingerprint so the same CrossInk session cannot be counted twice.
          - Keeps Phase 1 test payload compatibility for older firmware during rollout.
          - Keeps the visible app version locked to v5.10.30 while the v5.10.29 session-flow module is reused underneath.
          - Uses internal cache generation 51030p2 so installed PWAs cannot reuse the older Phase 1 v5.10.30 BLE script.
          EOF

      - name: Verify v5.10.30 wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          CACHE_GEN = '51030p2'
          s = Path('index.html').read_text()
          checks = [
              "window.__readingMmoVersionOwner='v5.10.30'",
              f'reading-flow-v51029.js?v={CACHE_GEN}',
              f'reading-ble-v51030.js?v={CACHE_GEN}',
              f'service-worker-v51030.js?v={CACHE_GEN}',
              f"u.searchParams.set('appv','{CACHE_GEN}')",
              'id="headerVersionText" class="app-version-badge">v5.10.30</span>',
          ]
          for check in checks:
              if check not in s:
                  raise SystemExit(f'missing expected v5.10.30 wiring: {check}')

          flow_src = Path('reading-flow-v51029.js').read_text()
          if "const BUILD='v5.10.29';" in flow_src:
              raise SystemExit('v5.10.29 flow still hard-stamps the visible app version')
          if "const BUILD=window.__readingMmoVersionOwner||'v5.10.29';" not in flow_src:
              raise SystemExit('v5.10.29 flow is not inheriting the current app version owner')

          ble = Path('reading-ble-v51030.js').read_text()
          for check in [
              "7d2ea28a-f7bd-485a-bd9d-92ad6ecfe93e",
              "7d2ea28b-f7bd-485a-bd9d-92ad6ecfe93e",
              "normalizePhase2",
              "['sid','sp','ep','pg','sec']",
              "recordQuestPageProgress",
              "recordQuestSessionProgress",
              "window.endReadingSession",
              "readingMmoReaderBlePhase2Imported",
              "IMPORT SESSION",
              "navigator.bluetooth.requestDevice",
              "characteristic.readValue()",
          ]:
              if check not in ble:
                  raise SystemExit(f'missing Phase 2 BLE import check: {check}')

          if "EXPECTED_SESSION_ID=1" in ble:
              raise SystemExit('old Phase 1-only payload gate is still active')

          sw = Path('service-worker-v51030.js').read_text()
          for check in [
              "reading-mmo-v5.10.30-reader-sync-phase2-import-p2",
              f"FORCE_VERSION = '{CACHE_GEN}'",
              "'./reading-ble-v51030.js'",
          ]:
              if check not in sw:
                  raise SystemExit(f'missing v5.10.30 service worker check: {check}')
          PY

      - name: Commit v5.10.30
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reading-flow-v51029.js reading-ble-v51030.js service-worker-v51030.js BUILD-NOTES-v5.10.30.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Reading MMO v5.10.30 force Phase 2 cache refresh"
            git push origin main
          fi