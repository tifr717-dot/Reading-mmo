          '''

          js = r'''/* Reading MMO v5.10.16b — artistic three-spine refinement.
             The approved Archive top and open-book detail are deliberately left alone. */
          (function(){
            const BUILD='v5.10.16b';
            const prototypeByTitle={
              "archangel's legion":{asset:'./archive-proto-legion-b.svg',cls:'proto-legion'},
              "angels' blood":{asset:'./archive-proto-angels-b.svg',cls:'proto-angels'},
              'a stage set for villains':{asset:'./archive-proto-stage-b.svg',cls:'proto-stage'}
            };
            const norm=v=>String(v||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');
            const safe=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
            const prior=window.libraryBookCardMarkup;
            function ensureCss(){
              let l=document.getElementById('archive-v51016b-css');
              if(l){if(!String(l.href||'').includes('v=51016b'))l.href='./archive-v51016b.css?v=51016b';return;}
              l=document.createElement('link');l.id='archive-v51016b-css';l.rel='stylesheet';l.href='./archive-v51016b.css?v=51016b';document.head.appendChild(l);
            }
            function stamp(){
              const badge=document.getElementById('headerVersionText');if(badge&&badge.textContent!==BUILD)badge.textContent=BUILD;
              document.querySelectorAll('.health-row').forEach(row=>{if(row.querySelector('b')?.textContent.trim()==='Version'){const s=row.querySelector('span');if(s&&s.textContent!==BUILD)s.textContent=BUILD;}});
            }
            window.libraryBookCardMarkup=function(b,volumeNo){
              const proto=prototypeByTitle[norm(b&&b.title)];
              if(!proto)return typeof prior==='function'?prior(b,volumeNo):'';
              const selected=String(window.__archiveSelectedId||'')===String(b.id)?' selected':'';
              const series=window.librarySeriesShort?window.librarySeriesShort(b.series):String(b.series||'Standalone');
              const sid=String(b.id||'').replace(/'/g,"\\'");
              return `<button class="v51016b-spine ${proto.cls}${selected}" onclick="window.__archiveSelectedId='${sid}';openLibraryRecord('${sid}')" aria-label="Open library record for ${safe(b.title)} by ${safe(b.author||'Unknown author')}"><img class="v51016b-spine-asset" src="${proto.asset}?v=51016b" alt="" aria-hidden="true">${b.favorite?'<span class="v51016b-spine-fav">★</span>':''}<span class="v51016b-spine-bookmark" aria-hidden="true"></span><span class="v51016b-spine-title">${safe(b.title)}</span><span class="v51016b-spine-series">${safe(series)}</span></button>`;
            };
            function wrapHealth(){const old=window.renderSaveHealth;if(typeof old==='function'&&!old.__v51016b){const wrapped=function(){const r=old.apply(this,arguments);setTimeout(stamp,0);return r};wrapped.__v51016b=true;window.renderSaveHealth=wrapped;}}
            function apply(){ensureCss();wrapHealth();stamp();if(typeof window.renderLibrary==='function')window.renderLibrary();[80,350,700,1400,2600].forEach(ms=>setTimeout(stamp,ms));}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();
          })();'''

          Path('archive-proto-legion-b.svg').write_text(legion, encoding='utf-8')
