name: Apply Reading MMO v5.10.9 archive visual rebuild

on:
  push:
    paths:
      - '.github/workflows/apply-reading-mmo-v5109.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v5.10.9
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text()

          # Remove the stale v5.10.6 runtime override that was forcing the visible badge/update checker backward.
          text = re.sub(r'\s*<script id="v5106-force-update">.*?</script>\s*', '\n', text, flags=re.S)

          # Visible version labels.
          text = re.sub(r'(<span id="headerVersionText"[^>]*>)v[^<]+(</span>)', r'\1v5.10.9\2', text)
          text = re.sub(r'(<div class="health-row"><b>Version</b><span>)v[^<]+(</span></div>)', r'\1v5.10.9\2', text)

          css = r'''
          <style id="v5109-archive-visual-rebuild">
          /* v5.10.9 — approved Archive top is LOCKED. Only shelf spines + open-book record are rebuilt. */

          /* ---------- SHELF: illustrated collected-volume spines ---------- */
          #library .v5104-shelf-row{
            min-height:330px!important;
            padding:24px 24px 34px!important;
            border-radius:14px!important;
            background:
              radial-gradient(ellipse at 50% 40%,rgba(126,77,39,.19),transparent 55%),
              linear-gradient(180deg,rgba(21,9,6,.08),rgba(9,4,3,.18)),
              url('./v53-wood-tile.png') center/178px auto repeat!important;
            box-shadow:
              0 10px 20px rgba(0,0,0,.28),
              inset 0 0 0 4px #2d160f,
              inset 0 0 0 7px #87562b,
              inset 0 0 0 9px rgba(231,184,96,.15)!important;
          }
          #library .v5104-shelf-row::before{
            left:17px!important;right:17px!important;top:14px!important;height:14px!important;
            border-radius:7px!important;
            background:linear-gradient(180deg,#b77c3d 0 18%,#724521 18% 62%,#32180f 62% 100%)!important;
            border:1px solid #9d6833!important;border-top-color:#d49a50!important;
            box-shadow:0 4px 0 rgba(15,7,4,.34),inset 0 1px rgba(255,224,155,.14)!important;
          }
          #library .v5104-shelf-row::after{
            left:21px!important;right:21px!important;bottom:12px!important;height:21px!important;
            background:linear-gradient(180deg,#d09248 0 13%,#7d4922 13% 46%,#432117 46% 79%,#1b0d08 79% 100%)!important;
            border:1px solid #875329!important;border-top-color:#e1aa62!important;
            box-shadow:0 6px 0 rgba(12,6,4,.49),inset 0 1px rgba(255,221,143,.12)!important;
          }
          #library .v5104-books{
            left:8%!important;right:8%!important;top:35px!important;bottom:34px!important;
            gap:5px!important;align-items:flex-end!important;justify-content:center!important;
          }
          #library .v5104-shelf-decor.candle{left:20px!important;bottom:39px!important;transform:scale(2.65)!important;opacity:.98!important}
          #library .v5104-shelf-decor.books{right:18px!important;bottom:39px!important;transform:scale(1.45)!important;opacity:.98!important}
          #library .v5104-shelf-decor.ivy-l{left:8px!important;top:5px!important;transform:scale(2) rotate(-13deg)!important}
          #library .v5104-shelf-decor.ivy-r{right:8px!important;top:5px!important;transform:scale(2) rotate(13deg) scaleX(-1)!important}

          #library .v5104-book{
            flex:1 1 0!important;min-width:0!important;max-width:76px!important;
            height:92%!important;padding:18px 5px 24px!important;overflow:visible!important;
            border:1px solid #180906!important;
            border-radius:13px 13px 4px 4px / 10px 10px 4px 4px!important;
            outline:1px solid rgba(235,193,102,.80)!important;outline-offset:-4px!important;
            background:
              linear-gradient(90deg,rgba(255,247,218,.19),transparent 10%,transparent 83%,rgba(0,0,0,.31)),
              radial-gradient(circle at 34% 8%,rgba(255,255,255,.12),transparent 18%),
              linear-gradient(180deg,var(--c1),var(--c2))!important;
            box-shadow:3px 6px 0 #120704,0 9px 12px rgba(0,0,0,.33),inset 0 0 13px rgba(0,0,0,.13)!important;
          }
          #library .v5104-book:nth-child(1){flex-grow:1.13!important;height:95%!important}
          #library .v5104-book:nth-child(2){flex-grow:.92!important;height:89%!important}
          #library .v5104-book:nth-child(3){flex-grow:1.02!important;height:94%!important}
          #library .v5104-book:nth-child(4){flex-grow:1.10!important;height:98%!important}
          #library .v5104-book:nth-child(5){flex-grow:.91!important;height:91%!important}
          #library .v5104-book:nth-child(6){flex-grow:1.08!important;height:96%!important}
          #library .v5104-book:nth-child(7){flex-grow:.98!important;height:90%!important}
          #library .v5104-book::before{
            content:""!important;position:absolute!important;inset:9px 7px 27px!important;
            border:1px solid rgba(248,211,124,.62)!important;border-radius:9px 9px 3px 3px!important;
            box-shadow:inset 0 0 0 1px rgba(52,21,11,.20)!important;pointer-events:none!important;
          }
          #library .v5104-book::after{
            content:""!important;position:absolute!important;left:8px!important;right:8px!important;bottom:28px!important;height:39px!important;
            background:
              linear-gradient(180deg,
                transparent 0 7%,rgba(244,202,108,.58) 7% 10%,transparent 10% 25%,
                rgba(255,240,190,.10) 25% 27%,transparent 27% 76%,
                rgba(244,202,108,.52) 76% 79%,transparent 79%)!important;
            pointer-events:none!important;
          }
          #library .v5104-book-title{
            inset:39px 9px 68px!important;
            color:#f9e5b0!important;
            font:900 clamp(7.8px,1.55vw,11.8px)/1 Georgia,'Times New Roman',serif!important;
            letter-spacing:.08px!important;text-shadow:0 1px 1px #1d0c07,0 0 4px rgba(0,0,0,.25)!important;
          }
          #library .v5104-book-icon{
            top:auto!important;bottom:36px!important;width:22px!important;height:22px!important;
            display:grid!important;place-items:center!important;
            color:#e9bc61!important;font:900 clamp(9px,1.7vw,13px)/1 Georgia,serif!important;
            text-shadow:0 1px 1px #1d0c07!important;
          }
          #library .v5109-spine-filigree{
            position:absolute;left:50%;top:17px;transform:translateX(-50%);z-index:4;
            color:#e4b85d;font:900 8px/1 Georgia,serif;text-shadow:0 1px 1px #1d0c07;
          }
          #library .v5109-spine-gem{
            position:absolute;left:50%;top:8px;transform:translateX(-50%) rotate(45deg);z-index:4;
            width:5px;height:5px;border:1px solid #f1d27f;background:rgba(86,48,105,.72);box-shadow:0 0 4px rgba(255,214,126,.25)
          }
          #library .v5104-book-series{
            left:6px!important;right:6px!important;bottom:7px!important;height:15px!important;
            color:#f0cf8b!important;background:linear-gradient(180deg,rgba(30,11,7,.22),rgba(9,4,3,.46))!important;
            border-top:1px solid rgba(244,204,112,.44)!important;border-bottom:1px solid rgba(8,3,2,.30)!important;
            font-size:clamp(4px,.84vw,6px)!important;
          }
          #library .v5104-book-fav{right:8px!important;top:9px!important;color:#ffe18b!important;font-size:8px!important}
          #library .v5105-spine-bookmark{right:7px!important;top:-3px!important;height:34px!important;width:9px!important}
          #library .v5104-book.selected{
            transform:translateY(-8px)!important;
            box-shadow:0 0 0 1px #f0d086,0 0 21px rgba(255,199,75,.44),3px 11px 0 #120704,0 14px 18px rgba(0,0,0,.36)!important;
          }

          /* ---------- OPEN BOOK: designed ledger spread, not floating form boxes ---------- */
          #library .v5104-detail-view{margin-top:10px!important}
          #library .v5104-detail-book{aspect-ratio:845/434!important;min-height:0!important;overflow:visible!important}
          #library .v5104-detail-left{
            left:5.8%!important;top:9.8%!important;width:38.5%!important;bottom:9%!important;
            display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;gap:6px!important;
          }
          #library .v5104-cover-frame{
            width:64%!important;max-height:73%!important;aspect-ratio:2/3!important;
            border:2px solid #2a130c!important;outline:1px solid #bd8a49!important;outline-offset:-5px!important;
            border-radius:4px!important;box-shadow:4px 6px 0 rgba(43,20,11,.58),0 9px 13px rgba(0,0,0,.20)!important;
          }
          #library .v5104-cover-frame img{color:transparent!important;font-size:0!important}
          #library .v5104-cover-placeholder{padding:8px!important}
          #library .v5104-cover-placeholder span{font-size:20px!important}
          #library .v5104-cover-placeholder b{font-size:6px!important;line-height:1.12!important}
          #library .v5104-cover-actions{width:76%!important;gap:3px!important;margin-top:1px!important}
          #library .v5104-cover-actions button{min-height:24px!important;padding:3px 5px!important;border-radius:7px!important;font-size:3.8px!important;box-shadow:0 3px 0 rgba(64,31,15,.25)!important}
          #library .v5104-cover-actions button:nth-child(2){
            min-height:18px!important;background:transparent!important;color:#78543a!important;border:0!important;box-shadow:none!important;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;
          }

          #library .v5104-detail-right{
            left:50.2%!important;right:7.1%!important;top:11.5%!important;bottom:9.5%!important;
            display:flex!important;flex-direction:column!important;min-width:0!important;color:#50331f!important;
          }
          #library .v5104-entry{
            align-self:center!important;margin-bottom:2px!important;padding:4px 13px!important;
            border-radius:3px 3px 8px 8px!important;
            background:linear-gradient(180deg,#9b6247,#75402f)!important;color:#f5ddb0!important;
            border:1px solid #70402d!important;box-shadow:0 2px 0 rgba(74,35,20,.18)!important;
            font-size:3.6px!important;letter-spacing:.35px!important;
          }
          #library .v5104-title{
            margin:5px 0 2px!important;max-width:100%!important;text-align:left!important;
            color:#442818!important;font:900 clamp(12px,2.9vw,19px)/.98 Georgia,'Times New Roman',serif!important;
            white-space:normal!important;overflow-wrap:anywhere!important;
            display:-webkit-box!important;-webkit-line-clamp:2!important;-webkit-box-orient:vertical!important;overflow:hidden!important;
          }
          #library .v5104-author{
            margin-top:1px!important;color:#79563b!important;font:700 clamp(4.6px,1.05vw,6.4px)/1.15 Georgia,'Times New Roman',serif!important;
            white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;
          }
          #library .v5104-rating-row{
            position:relative!important;margin-top:7px!important;padding-bottom:7px!important;min-height:25px!important;
            display:flex!important;align-items:center!important;gap:6px!important;
          }
          #library .v5104-rating-row::after{
            content:"✦  ─────────  ✦";position:absolute;left:0;right:0;bottom:-2px;text-align:center;
            color:#9c7247;font:700 4px/1 Georgia,serif;opacity:.65;
          }
          #library .v5104-rating{
            padding:5px 9px!important;border-radius:8px!important;background:#59351f!important;border:1px solid #8c6337!important;
            color:#f6d481!important;font-size:5.9px!important;box-shadow:0 2px 0 rgba(76,36,19,.13)!important;
          }
          #library .v5104-favorite{margin-left:0!important;color:#986320!important;font-size:4px!important;white-space:nowrap!important}

          #library .v5104-ledger{
            display:grid!important;grid-template-columns:1fr 1fr!important;gap:4px 10px!important;margin-top:7px!important;
          }
          #library .v5104-ledger>div{
            min-height:39px!important;padding:5px 2px 6px!important;
            border:0!important;border-bottom:1px solid rgba(145,101,54,.48)!important;border-radius:0!important;
            background:transparent!important;box-shadow:none!important;
          }
          #library .v5104-ledger span{margin-bottom:3px!important;color:#8a6547!important;font-size:3.2px!important;letter-spacing:.2px!important}
          #library .v5104-ledger b{color:#49301e!important;font:700 4.8px/1.1 Georgia,'Times New Roman',serif!important}
          #library .v5104-notes{
            margin-top:5px!important;max-height:34px!important;overflow:hidden!important;padding:4px 2px 0!important;
            border:0!important;color:#64452f!important;font:italic 700 4.1px/1.25 Georgia,'Times New Roman',serif!important;
          }
          #library .v5104-notes b{font-style:normal!important;color:#876042!important;font-size:3.1px!important;letter-spacing:.18px!important}
          #library .v5104-detail-actions{
            left:0!important;right:0!important;bottom:0!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:7px!important;
          }
          #library .v5104-detail-actions button{
            min-height:25px!important;padding:3px 5px!important;border-radius:8px!important;font-size:3.8px!important;box-shadow:0 3px 0 rgba(64,31,15,.22)!important;
          }
          #library .v5104-detail-close{
            right:7.6%!important;top:7.8%!important;padding:4px 8px!important;border-radius:999px!important;
            background:#4d2d1e!important;color:#ead09a!important;border-color:#936536!important;font-size:3.3px!important;
          }

          @media(max-width:420px){
            #library .v5104-shelf-row{min-height:300px!important;padding:23px 20px 34px!important}
            #library .v5104-books{left:7%!important;right:7%!important;gap:3px!important}
            #library .v5104-book{max-width:59px!important;border-radius:10px 10px 3px 3px / 8px 8px 3px 3px!important}
            #library .v5104-book-title{inset:38px 7px 63px!important;font-size:6.8px!important}
            #library .v5104-book-icon{bottom:33px!important;font-size:8.5px!important}
            #library .v5109-spine-filigree{top:16px!important;font-size:6px!important}
            #library .v5104-book-series{left:5px!important;right:5px!important;height:13px!important;font-size:3.55px!important}
            #library .v5104-detail-left{left:5.8%!important;top:10.5%!important;width:38.5%!important;bottom:9.5%!important}
            #library .v5104-cover-frame{width:65%!important}
            #library .v5104-detail-right{left:50.2%!important;right:6.9%!important;top:12.2%!important;bottom:10.2%!important}
            #library .v5104-title{font-size:12px!important;line-height:.99!important;margin-top:4px!important}
            #library .v5104-ledger>div{min-height:34px!important;padding:4px 1px 5px!important}
            #library .v5104-ledger b{font-size:4.25px!important}
            #library .v5104-cover-actions button,#library .v5104-detail-actions button{font-size:3.35px!important;min-height:22px!important}
          }
          </style>
          '''
          if 'v5109-archive-visual-rebuild' not in text:
              text = text.replace('</head>', css + '\n</head>')

          # Deterministic visual palettes for the currently archived series so old saved color=0 records still show the intended multi-color concept.
          start = text.index('function libraryBookCardMarkup(b,volumeNo){')
          end = text.index('function libraryShelfRowsMarkup', start)
          new_func = r'''function libraryBookCardMarkup(b,volumeNo){
           const n=Number(volumeNo||1), h=(n-1)%5+1;
           const selected=String(libraryDetailId||'')===String(b.id)?' selected':'';
           const series=librarySeriesShort(b.series);
           const palettes={
             '#6':['#9f7631','#4b3318'],
             '#5':['#6f6c58','#343128'],
             '#4':['#4e809b','#243f50'],
             '#3':['#4f8068','#243e34'],
             '#2':['#76539a','#3b234d'],
             '#1':['#965446','#4c2921'],
             'STANDALONE':['#87536b','#432633']
           };
           const fallback=[['#76539a','#3b234d'],['#965446','#4c2921'],['#4f8068','#243e34'],['#9f7631','#4b3318'],['#4e809b','#243f50'],['#87536b','#432633'],['#6f6c58','#343128'],['#9c6748','#4d2e21']];
           const pal=palettes[series]||fallback[Math.abs(Number(b.color)||0)%fallback.length];
           const motif=series==='#6'?'⚜':series==='#5'?'☁':series==='#4'?'†':series==='#3'?'❧':series==='#2'?'♡':series==='#1'?'♦':series==='STANDALONE'?'◈':'✦';
           return `<button class="v5104-book h${h}${selected}" style="--c1:${pal[0]};--c2:${pal[1]}" onclick="openLibraryRecord('${esc(b.id)}')" aria-label="Open library record for ${esc(b.title)} by ${esc(b.author||'Unknown author')}">
             ${b.favorite?'<span class="v5104-book-fav">★</span>':''}
             <span class="v5109-spine-gem" aria-hidden="true"></span>
             <span class="v5109-spine-filigree" aria-hidden="true">⌁</span>
             <span class="v5105-spine-bookmark" aria-hidden="true"></span>
             <span class="v5104-book-title">${esc(b.title)}</span>
             <span class="v5104-book-icon">${motif}</span>
             <span class="v5104-book-series">${esc(series)}</span>
            </button>`;
          }
          '''
          text = text[:start] + new_func + text[end:]

          # Keep broken cover files from ever showing browser alt text.
          text = text.replace('<img id="libraryDetailCoverImg" alt="Book cover" hidden>', '<img id="libraryDetailCoverImg" alt="" hidden>')
          text = text.replace('<img id="libraryDetailCoverImg" alt="" hidden>', '<img id="libraryDetailCoverImg" alt="" hidden>')

          p.write_text(text)

          sw = Path('service-worker.js')
          sw_text = sw.read_text()
          sw_text = re.sub(r"const CACHE = 'reading-mmo-[^']+';", "const CACHE = 'reading-mmo-v5.10.9-archive-visual-rebuild';", sw_text, count=1)
          sw.write_text(sw_text)

          Path('BUILD-NOTES-v5.10.9.txt').write_text('''Reading MMO v5.10.9 — Archive Visual Rebuild\n\n- Approved Archive title/stats/search/filter artwork remains locked and unchanged.\n- Removed the stale v5.10.6 runtime update override that was forcing the installed app badge/checker backward.\n- Rebuilt the shelf spines with deterministic Guild Hunter colors, stronger leather depth, gold inset trim, top filigree/gems, lower crests, and a clearer selected-book state.\n- Reworked the open-book record into a more natural ledger spread: larger cover, cleaner title/author hierarchy, decorative divider, unboxed parchment metadata, and less bulky cover controls.\n- App Health/header badge/service-worker cache bumped to v5.10.9.\n''')

      - name: Commit and remove updater
        run: |
          git config user.name "Reading MMO updater"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-reading-mmo-v5109.yml
          git add index.html service-worker.js BUILD-NOTES-v5.10.9.txt
          git commit -m "Reading MMO v5.10.9 archive visual rebuild"
          git push
