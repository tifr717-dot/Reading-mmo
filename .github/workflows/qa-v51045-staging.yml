name: QA v5.10.45 Staging

on:
  push:
    branches:
      - v51045-simplified-redesign
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check reading-journal-layered-v51043v.js
          node --check simplified-redesign-v51045.js
          node --check home-v51045-runtime.js
          node --check service-worker-v51043.js
      - name: Validate Home boot2
        run: |
          python3 - <<'PY'
          import base64, pathlib
          p=pathlib.Path('home-v51045-master-clean-level.b64.txt')
          assert p.exists() and p.stat().st_size > 500000
          raw=base64.b64decode(''.join(p.read_text().split()), validate=True)
          assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'
          print('Clean Home master',len(raw),'bytes')
          PY
          grep -q 'id="v51045AppShell" style="visibility:hidden"' index.html
          grep -q 'reading-journal-layered-v51043v.js?v=51045boot2' index.html
          grep -q 'service-worker-v51043.js?v=51045boot2' index.html
          grep -q "home-v51045-runtime.js?v=51045boot2" reading-journal-layered-v51043v.js
          grep -q "simplified-redesign-v51045.js?v=51045boot2" reading-journal-layered-v51043v.js
          grep -q "v5.10.45-home-boot2" home-v51045-runtime.js
          grep -q "v51045-home-active" home-v51045-runtime.js
          grep -q "style.visibility='visible'" home-v51045-runtime.js
          grep -q "reading-mmo-v5.10.45-home-boot2" service-worker-v51043.js
          ! grep -q "c.navigate" service-worker-v51043.js
          ! grep -q "FORCE_VERSION" service-worker-v51043.js
          echo "Home boot2 prevents legacy shell reload/flash"
