name: QA v5.10.45 Staging

on:
  push:
    branches:
      - v51045-simplified-redesign
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check v5.10.45 JavaScript syntax
        run: |
          node --check reading-journal-layered-v51043v.js
          node --check simplified-redesign-v51045.js
          node --check home-v51045-runtime.js
      - name: Validate Jetpack Home artwork layers
        run: |
          python3 - <<'PY'
          import base64, pathlib
          files=[
            'home-v51045-hero-rank.b64.txt',
            'home-v51045-currently-reading.b64.txt',
            'home-v51045-stats.b64.txt',
            'home-v51045-progress-challenges.b64.txt',
            'home-v51045-footer-navigation.b64.txt',
          ]
          for name in files:
            p=pathlib.Path(name)
            assert p.exists() and p.stat().st_size > 1000, f'{name} missing or too small'
            raw=base64.b64decode(p.read_text().strip(), validate=True)
            assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP', f'{name} is not WebP'
            print(name, len(raw), 'bytes')
          PY
      - name: Validate staging wiring
        run: |
          grep -q "The Reading Journal" manifest.webmanifest
          grep -q "home-v51045-runtime.js" reading-journal-layered-v51043v.js
          grep -q "simplified-redesign-v51045.js" reading-journal-layered-v51043v.js
          grep -q "home-v51045-hero-rank.b64.txt" home-v51045-runtime.js
          grep -q "home-v51045-currently-reading.b64.txt" home-v51045-runtime.js
          grep -q "home-v51045-stats.b64.txt" home-v51045-runtime.js
          grep -q "home-v51045-progress-challenges.b64.txt" home-v51045-runtime.js
          grep -q "home-v51045-footer-navigation.b64.txt" home-v51045-runtime.js
          grep -q "data-live-slot" home-v51045-runtime.js
          ! grep -q "v51045-mask" home-v51045-runtime.js
          echo "v5.10.45 Jetpack staging wiring OK"
