name: QA v5.10.45 Staging

on:
  push:
    branches:
      - v51045-simplified-redesign
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check reading-journal-layered-v51043v.js
          node --check simplified-redesign-v51045.js
          node --check home-v51045-runtime.js
      - name: Validate legacy-shell flash guard
        run: |
          python3 - <<'PY'
          import base64, pathlib
          p=pathlib.Path('home-v51045-master-clean-level.b64.txt')
          assert p.exists() and p.stat().st_size > 500000
          raw=base64.b64decode(''.join(p.read_text().split()), validate=True)
          assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP'
          print('Clean Home master',len(raw),'bytes')
          PY
          grep -q 'id="v51045-home-prepaint-guard"' index.html
          grep -q '.app{visibility:hidden!important}' index.html
          grep -q 'body.v51045-home-ready .app{visibility:visible!important}' index.html
          grep -q 'reading-journal-layered-v51043v.js?v=51045shellguard' index.html
          grep -q "add('./home-v51045-runtime.js?v=51045shellguard','v51045Home')" reading-journal-layered-v51043v.js
          grep -q "finally(()=>add('./simplified-redesign-v51045.js?v=51045shellguard','v51045Simplified'))" reading-journal-layered-v51043v.js
          grep -q 'v5.10.45-home-shell-guard' home-v51045-runtime.js
          grep -q 'v51045-home-ready' home-v51045-runtime.js
          grep -q 'art.decode' home-v51045-runtime.js
          grep -q 'v51045Level' home-v51045-runtime.js
          ! grep -q 'v51045Rank' home-v51045-runtime.js
          ! grep -q 'v51045XpCurrent' home-v51045-runtime.js
          ! grep -q 'v51045ExpFill' home-v51045-runtime.js
          echo "Legacy shell cannot paint before approved Home"
