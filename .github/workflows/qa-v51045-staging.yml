name: QA v5.10.45 Staging

on:
  push:
    branches:
      - v51045-simplified-redesign
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check reading-journal-layered-v51043v.js
          node --check simplified-redesign-v51045.js
          node --check home-v51045-runtime.js
          node --check service-worker-v51043.js

      - name: Validate locked Reader Level geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['home-v51045-master-clean-level.webp','home-v51045-ornate-bar-frame.png']:
              p=Path(name)
              assert p.exists() and p.stat().st_size > 1000
          PY

          grep -q 'home-v51045-runtime.js?v=51045today2' index.html
          grep -q 'home-v51045-master-clean-level.webp?v=51045locked1' index.html
          grep -q 'home-v51045-ornate-bar-frame.png?v=51045locked1' index.html

          grep -q "v5.10.45-home-today-progress-editor2" home-v51045-runtime.js

          grep -q "left:53.60%;top:31.50%;width:27.90%;height:3.30%" home-v51045-runtime.js
          grep -q "left:7.80%;right:0.00%;top:27.00%;height:47.00%" home-v51045-runtime.js
          grep -q "left:52.50%;top:27.60%" home-v51045-runtime.js
          grep -q "left:53.40%;top:34.80%" home-v51045-runtime.js

          grep -q "barX:53.60,barY:31.50,barW:27.90,barH:3.30" home-v51045-runtime.js
          grep -q "fillL:7.80,fillR:0.00,fillY:27.00,fillH:47.00" home-v51045-runtime.js
          grep -q "titleX:52.50,titleY:27.60" home-v51045-runtime.js
          grep -q "xpX:53.40,xpY:34.80" home-v51045-runtime.js

          grep -q "READER EDITOR" home-v51045-runtime.js
          grep -q "PURPLE FILL" home-v51045-runtime.js
          grep -q "TITLE + EXP" home-v51045-runtime.js

          grep -q "left:11.90%;top:65.40%;width:12.50%" home-v51045-runtime.js
          grep -q "left:18.15%;top:69.57%" home-v51045-runtime.js
          grep -q "left:27.50%;top:66.00%;width:18%" home-v51045-runtime.js
          grep -q "ringX:11.90,ringY:65.40,ringSize:12.50,ringHole:55.00" home-v51045-runtime.js
          grep -q "previewFill:Math.round(live.pct)" home-v51045-runtime.js
          grep -q "\['ringX','X / Left',0,90,.1\]" home-v51045-runtime.js
          grep -q "\['ringY','Y / Top',0,92,.1\]" home-v51045-runtime.js
          grep -q "\['previewFill','Preview fill',0,100,1\]" home-v51045-runtime.js
          grep -q "data-preview-fill=\"100\"" home-v51045-runtime.js
          grep -q "ring.style.setProperty('--pct',state.previewFill+'%')" home-v51045-runtime.js
          grep -q "pctX:18.15,pctY:69.57,pctSize:2.20" home-v51045-runtime.js
          grep -q "pagesX:27.50,pagesY:66.00,pagesW:18.00,pagesSize:1.90" home-v51045-runtime.js
          grep -q "TODAY EDITOR" home-v51045-runtime.js
          grep -Fq "TODAY\\'S PROGRESS EDITOR" home-v51045-runtime.js

          grep -q "function todayReadingState()" index.html
          grep -q 'todayDate:"",todayPages:0,todayGoal:100' index.html
          grep -q "r.todayPages=Math.max(0,Number(r.todayPages)||0)+added" index.html

          echo "Locked Reader Level + live Today Progress editor OK"
