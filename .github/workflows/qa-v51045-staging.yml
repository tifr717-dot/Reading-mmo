name: QA v5.10.45 Staging

on:
  push:
    branches:
      - v51045-simplified-redesign
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check reading-journal-layered-v51043v.js
          node --check simplified-redesign-v51045.js
          node --check home-v51045-runtime.js
          node --check service-worker-v51043.js

      - name: Validate expanded Reader Level editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['home-v51045-master-clean-level.webp','home-v51045-ornate-bar-frame.png']:
              p=Path(name)
              assert p.exists() and p.stat().st_size > 1000
          PY

          grep -q 'home-v51045-runtime.js?v=51045bareditor2' index.html
          grep -q 'home-v51045-master-clean-level.webp?v=51045bareditor2' index.html
          grep -q 'home-v51045-ornate-bar-frame.png?v=51045bareditor2' index.html

          grep -q "v5.10.45-home-reader-xp-bar-editor2" home-v51045-runtime.js
          grep -q "PURPLE FILL" home-v51045-runtime.js
          grep -q "TITLE + EXP" home-v51045-runtime.js
          grep -q "barX:53.70,barY:31.50,barW:27.90,barH:3.30" home-v51045-runtime.js
          grep -q "fillL:11.8,fillR:11.8,fillY:38.0,fillH:22.0" home-v51045-runtime.js
          grep -q "titleX:51.80,titleY:27.95" home-v51045-runtime.js
          grep -q "xpX:53.70,xpY:36.15" home-v51045-runtime.js
          grep -q "READER EDITOR" home-v51045-runtime.js
          grep -q "COPY VALUES" home-v51045-runtime.js

          echo "Expanded Reader Level editor OK"
