name: QA v5.10.45 Staging

on:
  push:
    branches:
      - v51045-simplified-redesign
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check v5.10.45 JavaScript syntax
        run: |
          node --check reading-journal-layered-v51043v.js
          node --check simplified-redesign-v51045.js
          node --check home-v51045-runtime.js
      - name: Validate Layer 01D artwork source
        run: |
          python3 - <<'PY'
          import base64, pathlib
          p=pathlib.Path('home-v51045-master-base.b64.txt')
          assert p.exists() and p.stat().st_size > 100000, 'full Home master missing or too small'
          raw=base64.b64decode(''.join(p.read_text().split()), validate=True)
          assert raw[:4] == b'RIFF' and raw[8:12] == b'WEBP', 'Home master is not WebP'
          print('Layer 01D full Home master',len(raw),'bytes')
          PY
      - name: Validate Layer 01D staging wiring
        run: |
          grep -q "The Reading Journal" manifest.webmanifest
          grep -q "home-v51045-runtime.js?v=51045layer01d" reading-journal-layered-v51043v.js
          grep -q "simplified-redesign-v51045.js?v=51045layer01d" reading-journal-layered-v51043v.js
          grep -q "home-v51045-master-base.b64.txt" home-v51045-runtime.js
          grep -q "v5.10.45-home-layer-01d" home-v51045-runtime.js
          grep -q "v51045-canvas" home-v51045-runtime.js
          grep -q "v51045Level" home-v51045-runtime.js
          grep -q "v51045Rank" home-v51045-runtime.js
          grep -q "v51045XpCurrent" home-v51045-runtime.js
          ! grep -q "v51045BookTitle" home-v51045-runtime.js
          ! grep -q "v51045DailyPages" home-v51045-runtime.js
          ! grep -q "v51045Ch3" home-v51045-runtime.js
          ! grep -q "home-v51045-footer-navigation.b64.txt" home-v51045-runtime.js
          echo "Home Layer 01D (true full master + rank only) staging wiring OK"
