name: Apply Reading MMO v5.10.27 Progress Sync

on:
  push:
    paths:
      - '.github/workflows/apply-reading-mmo-v51027-progress-sync.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair progress runtime state access
        shell: python
        run: |
          from pathlib import Path
          p=Path('reading-progress-v51027.js')
          text=p.read_text(encoding='utf-8')
          # The main app declares S with top-level `let`, so it is a global lexical
          # binding rather than window.S. External classic scripts can reference S
          # directly, but window.S would be undefined.
          text=text.replace('window.S', 'S')
          p.write_text(text,encoding='utf-8')

      - name: Integrate streamlined Progress Sync
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          text=re.sub(
            r'(<span id="headerVersionText" class="app-version-badge">)v5\.10\.\d+(</span>)',
            r'\1v5.10.27\2', text, count=1)
          text=re.sub(
            r'(<div class="health-row"><b>Version</b><span>)v5\.10\.\d+(</span></div>)',
            r'\1v5.10.27\2', text, count=1)

          owner="<script>window.__readingMmoVersionOwner='v5.10.27';</script>"
          text=re.sub(
            r"<script>window\.__readingMmoVersionOwner='v5\.10\.\d+';(?:window\.__dedicatedShelfRuntime=true;)?</script>",
            owner, text, count=1)

          # Cache-bust the loaded runtime stack while keeping the current Archive
          # implementation intact.
          loaded=[
            'archive-v51011.js','archive-v51013.js','archive-v51014.js',
            'archive-v51016.js','archive-v51018.js','reading-shelf-v51021.js',
            'archive-v51022.js','archive-v51025.js'
          ]
          for name in loaded:
            text=re.sub(
              rf'(<script src="\./{re.escape(name)}\?v=)\d+("?></script>)',
              rf'\g<1>51027\2', text, count=1)

          progress='<script src="./reading-progress-v51027.js?v=51027"></script>'
          if 'reading-progress-v51027.js' not in text:
            anchor=re.search(r'<script src="\./archive-v51025\.js\?v=51027"></script>',text)
            if not anchor:
              raise SystemExit('Could not locate Archive v5.10.25/26 runtime anchor')
            text=text[:anchor.end()]+'\n'+progress+text[anchor.end():]
          else:
            text=re.sub(
              r'<script src="\./reading-progress-v51027\.js\?v=\d+"></script>',
              progress,text,count=1)

          text=re.sub(
            r'navigator\.serviceWorker\.register\("\./service-worker-v510\d+\.js\?v=\d+"',
            'navigator.serviceWorker.register("./service-worker-v51027.js?v=51027"',
            text,count=1)

          p.write_text(text,encoding='utf-8')

      - name: Make legacy visual runtimes respect the current app version
        shell: python
        run: |
          from pathlib import Path
          import re

          loaded=[
            'archive-v51011.js','archive-v51013.js','archive-v51014.js',
            'archive-v51016.js','archive-v51018.js','archive-v51022.js',
            'archive-v51025.js'
          ]
          for name in loaded:
            p=Path(name)
            text=p.read_text(encoding='utf-8')
            text=re.sub(
              r"const BUILD='(v5\.10\.\d+)';",
              r"const BUILD=window.__readingMmoVersionOwner||'\1';",
              text,count=1)
            p.write_text(text,encoding='utf-8')

      - name: Create v5.10.27 service worker
        shell: python
        run: |
          from pathlib import Path
          import re

          src=Path('service-worker-v51026.js').read_text(encoding='utf-8')
          text=re.sub(
            r"const CACHE = 'reading-mmo-v5\.10\.26-[^']+';",
            "const CACHE = 'reading-mmo-v5.10.27-progress-sync';",
            src,count=1)
          text=text.replace("const FORCE_VERSION = '51026';","const FORCE_VERSION = '51027';",1)
          if "'./reading-progress-v51027.js'" not in text:
            needle="  './reading-shelf-v51021.js',\n"
            if needle not in text:
              raise SystemExit('Could not find reading shelf asset in service worker')
            text=text.replace(needle,needle+"  './reading-progress-v51027.js',\n",1)
          Path('service-worker-v51027.js').write_text(text,encoding='utf-8')

      - name: Verify v5.10.27 before push
        shell: bash
        run: |
          set -euo pipefail
          node --check reading-progress-v51027.js
          node --check archive-v51025.js
          node --check archive-v51022.js
          node --check service-worker-v51027.js
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          progress=Path('reading-progress-v51027.js').read_text(encoding='utf-8')
          sw=Path('service-worker-v51027.js').read_text(encoding='utf-8')
          a25=Path('archive-v51025.js').read_text(encoding='utf-8')
          a22=Path('archive-v51022.js').read_text(encoding='utf-8')

          assert "window.__readingMmoVersionOwner='v5.10.27'" in html
          assert './reading-progress-v51027.js?v=51027' in html
          assert './service-worker-v51027.js?v=51027' in html
          assert './archive-v51025.js?v=51027' in html
          assert 'reading-desk-v51022.js' not in html
          assert 'window.S' not in progress
          assert 'MutationObserver' not in progress
          assert 'PAGE / TOTAL' in progress
          assert 'PERCENT' in progress
          assert 'SESSION PROGRESS' in progress
          assert 'MMO READING TOTAL' in progress
          assert "FORCE_VERSION = '51027'" in sw
          assert "'./reading-progress-v51027.js'" in sw
          assert "const BUILD=window.__readingMmoVersionOwner||'v5.10.26';" in a25
          assert 'const BUILD=window.__readingMmoVersionOwner||' in a22
          print('v5.10.27 progress sync verification passed')
          PY

      - name: Commit v5.10.27
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reading-progress-v51027.js service-worker-v51027.js \
            archive-v51011.js archive-v51013.js archive-v51014.js archive-v51016.js \
            archive-v51018.js archive-v51022.js archive-v51025.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Reading MMO v5.10.27 streamline progress and session tracking"
          git push
