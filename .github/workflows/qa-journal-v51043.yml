name: QA Reading Journal v5.10.43

on:
  push:
    branches:
      - journal-mockup-rebuild
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Journal JavaScript syntax
        run: |
          node --check reading-journal-v51032.js
          node --check reading-journal-mobile-v51035.js
          node --check reading-journal-cascade-v51038.js
          node --check reading-journal-polish-v51039.js
          node --check reading-journal-visual-v51040.js
          node --check reading-journal-art-v51041.js
          node --check reading-journal-fix-v51042.js
          node --check reading-journal-mockup-v51043.js
          node --check reading-journal-mockup-stats-v51043.js
          node --check reading-journal-mockup-lower-v51043.js
          node --check reading-journal-mockup-final-v51043.js
          node --check service-worker-v51043.js
      - name: Validate lower-art pack
        run: |
          python3 - <<'PY'
          import json, pathlib
          parts=[]
          for i in range(1,8):
              p=pathlib.Path(f'journal-mockup-lower-pack-part-{i:02d}.txt')
              assert p.exists() and p.stat().st_size>0, p
              parts.append(p.read_text())
          pack=json.loads(''.join(parts))
          for key in ('ledger','ribbon','lav','blue','footer'):
              assert key in pack and len(pack[key])>100, key
          print('lower-art pack OK:', ', '.join(sorted(pack)))
          PY
      - name: Validate exact Journal assets
        run: |
          test -s journal-mockup-top-exact-v1.webp
          test -s journal-mockup-selector-strip-blank-v1.webp
          test -s journal-mockup-stats-blank-v1.webp
          grep -q "v5.10.43" reading-journal-fix-v51042.js
          grep -q "service-worker-v51043.js" reading-journal-mockup-final-v51043.js
          grep -q "journal-mockup-lower-pack-part-07.txt" service-worker-v51043.js
          echo "v5.10.43 Journal wiring OK"
