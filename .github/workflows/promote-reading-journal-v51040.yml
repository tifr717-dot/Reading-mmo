name: Promote Reading Journal v5.10.40

on:
  push:
    branches: [ main ]
    paths:
      - 'reading-journal-visual-v51040.js'
      - '.github/workflows/promote-reading-journal-v51040.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote compact Archivist Journal to v5.10.40
        id: promote
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed=[]

          idxp=Path('index.html')
          idx=idxp.read_text(); out=idx
          out=out.replace('app-version-badge">v5.10.39','app-version-badge">v5.10.40')
          out=out.replace('<b>Version</b><span>v5.10.39</span>','<b>Version</b><span>v5.10.40</span>')
          out=out.replace("window.__readingMmoVersionOwner='v5.10.39'","window.__readingMmoVersionOwner='v5.10.40'")
          for name in ['reading-journal-v51032.js','reading-journal-mobile-v51035.js','reading-journal-cascade-v51038.js','reading-journal-polish-v51039.js']:
              out=out.replace(f'./{name}?v=51039',f'./{name}?v=51040')
          out=out.replace('./service-worker-v51039.js?v=51039','./service-worker-v51040.js?v=51040')

          polish='<script src="./reading-journal-polish-v51039.js?v=51040"></script>'
          visual='<script src="./reading-journal-visual-v51040.js?v=51040"></script>'
          if visual not in out:
              if polish not in out: raise SystemExit('could not find v5.10.39 polish script')
              out=out.replace(polish,polish+'\n'+visual,1)
          if out!=idx:
              idxp.write_text(out);changed.append('index.html')

          jp=Path('reading-journal-v51032.js')
          j=jp.read_text(); j2=j.replace("const BUILD='v5.10.39'","const BUILD='v5.10.40'")
          if j2!=j:
              jp.write_text(j2);changed.append(str(jp))

          swp=Path('service-worker-v51039.js')
          sw=swp.read_text(); sw2=sw
          sw2=sw2.replace("const CACHE = 'reading-mmo-v5.10.39-journal-scroll-polish';","const CACHE = 'reading-mmo-v5.10.40-archivist-visual-polish';")
          sw2=sw2.replace("const FORCE_VERSION = '51039';","const FORCE_VERSION = '51040';")
          visual_core="  './reading-journal-visual-v51040.js',\n"
          if "'./reading-journal-visual-v51040.js'" not in sw2:
              needle="  './reading-journal-polish-v51039.js',\n"
              if needle not in sw2: raise SystemExit('could not add visual layer to worker core')
              sw2=sw2.replace(needle,needle+visual_core,1)
          if sw2!=sw:
              swp.write_text(sw2);changed.append(str(swp))

          fresh=Path('service-worker-v51040.js')
          if not fresh.exists() or fresh.read_text()!=sw2:
              fresh.write_text(sw2);changed.append(str(fresh))

          mp=Path('manifest.webmanifest')
          m=mp.read_text(); m2=m.replace('"start_url": "./?appv=51039"','"start_url": "./?appv=51040"')
          if m2!=m:
              mp.write_text(m2);changed.append(str(mp))

          Path('/tmp/changed').write_text('true' if changed else 'false')
          print('changed:', ', '.join(changed) if changed else 'none')
          PY
          echo "changed=$(cat /tmp/changed)" >> "$GITHUB_OUTPUT"

      - name: Commit v5.10.40 runtime
        if: steps.promote.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reading-journal-v51032.js reading-journal-visual-v51040.js service-worker-v51039.js service-worker-v51040.js manifest.webmanifest
          git commit -m "Activate Reading MMO v5.10.40 compact Archivist Journal"
          git push origin HEAD:main

      - name: Request fresh Pages build
        if: steps.promote.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Verify JavaScript syntax
        run: |
          node --check reading-journal-v51032.js
          node --check reading-journal-polish-v51039.js
          node --check reading-journal-visual-v51040.js
          node --check service-worker-v51039.js
          node --check service-worker-v51040.js

      - name: Verify v5.10.40 visual runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          visual=Path('reading-journal-visual-v51040.js').read_text()
          sw=Path('service-worker-v51040.js').read_text()
          manifest=Path('manifest.webmanifest').read_text()
          checks=[
            ('index version','app-version-badge">v5.10.40' in idx),
            ('visual script','reading-journal-visual-v51040.js?v=51040' in idx),
            ('worker registration','service-worker-v51040.js?v=51040' in idx),
            ('compact header','.v51034-title' in visual and 'font-size:23px!important' in visual),
            ('remove clipped hero','.v51034-book-hero{display:none!important}' in visual),
            ('ledger cells','.v51034-ledger-note' in visual and 'border-top:1px solid' in visual),
            ('scroll preserved','#v51034JournalBody' in visual),
            ('worker cache',"reading-mmo-v5.10.40-archivist-visual-polish" in sw and "FORCE_VERSION = '51040'" in sw),
            ('visual cached',"'./reading-journal-visual-v51040.js'" in sw),
            ('manifest','"start_url": "./?appv=51040"' in manifest),
          ]
          bad=[name for name,ok in checks if not ok]
          if bad: raise SystemExit('missing: '+', '.join(bad))
          PY
